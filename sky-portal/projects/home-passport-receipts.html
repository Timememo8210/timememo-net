<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<script src="/sky-portal/_gate.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Receipt Scanner · Home Passport</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --primary: #007BFF;
  --primary-hover: #0069d9;
  --primary-light: #EFF6FF;
  --slate-50: #F8FAFC;
  --slate-100: #F1F5F9;
  --slate-200: #E2E8F0;
  --slate-300: #CBD5E1;
  --slate-400: #94A3B8;
  --slate-500: #64748B;
  --slate-600: #475569;
  --slate-700: #334155;
  --slate-900: #1E293B;
  --success: #10B981;
  --success-light: #ECFDF5;
  --warning: #F59E0B;
  --error: #EF4444;
  --error-light: #FEF2F2;
  --violet: #8B5CF6;
  --violet-light: #F5F3FF;
}
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: var(--slate-50);
  color: var(--slate-600);
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ===== HEADER ===== */
.app-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 28px;
}
.app-header svg {
  color: var(--slate-400);
  flex-shrink: 0;
}
.app-header .title {
  font-size: 18px;
  font-weight: 700;
  color: var(--slate-900);
  letter-spacing: -0.01em;
}
.app-header .subtitle {
  font-size: 12px;
  color: var(--slate-400);
  margin-top: 1px;
}

/* ===== TAB BAR ===== */
.tab-bar {
  display: flex;
  background: var(--slate-100);
  border-radius: 10px;
  padding: 3px;
  margin-bottom: 28px;
  gap: 2px;
}
.tab-btn {
  flex: 1;
  padding: 8px 16px;
  border: none;
  background: transparent;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  color: var(--slate-500);
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
}
.tab-btn.active {
  background: white;
  color: var(--slate-900);
  box-shadow: 0 1px 2px rgba(0,0,0,0.06);
}

/* ===== STEP INDICATOR ===== */
.step-indicator {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0;
  margin-bottom: 32px;
}
.step-dot {
  width: 28px; height: 28px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 600;
  border: 1.5px solid var(--slate-200);
  color: var(--slate-400);
  background: white;
  transition: all 0.2s;
}
.step-dot.active {
  border-color: var(--slate-900);
  background: var(--slate-900);
  color: white;
}
.step-dot.done {
  border-color: var(--slate-900);
  background: var(--slate-900);
  color: white;
}
.step-line {
  width: 40px; height: 1.5px;
  background: var(--slate-200);
  transition: background 0.2s;
}
.step-line.done { background: var(--slate-900); }

/* ===== CARD ===== */
.card {
  background: white;
  border: 1px solid var(--slate-100);
  border-radius: 12px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  padding: 20px;
  margin-bottom: 12px;
}

/* ===== SECTION LABEL ===== */
.section-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--slate-400);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 16px;
}

/* ===== FIELD ===== */
.field { margin-bottom: 16px; }
.field:last-child { margin-bottom: 0; }
.field-label {
  font-size: 12px;
  font-weight: 500;
  color: var(--slate-500);
  margin-bottom: 4px;
}
.field-value {
  font-size: 15px;
  color: var(--slate-900);
  padding: 6px 10px;
  border: 1px solid transparent;
  border-radius: 8px;
  background: transparent;
  min-height: 36px;
  cursor: text;
  transition: all 0.15s;
  display: flex;
  align-items: center;
}
.field-value:hover { background: var(--slate-50); }
.field-value.editing {
  background: white;
  border-color: var(--primary);
  outline: none;
  box-shadow: 0 0 0 3px rgba(0,123,255,0.08);
}

/* ===== ITEM ROW ===== */
.item-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 7px 0;
  border-bottom: 1px solid var(--slate-100);
}
.item-row:last-child { border-bottom: none; }
.item-desc { color: var(--slate-600); font-size: 14px; flex: 1; }
.item-amount { color: var(--slate-900); font-size: 14px; font-weight: 500; margin-left: 12px; }

/* ===== BUTTONS ===== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 12px;
  padding: 12px 24px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  border: none;
  font-family: inherit;
  min-height: 44px;
}
.btn-primary {
  background: var(--primary);
  color: white;
}
.btn-primary:hover { background: var(--primary-hover); }
.btn-secondary {
  background: white;
  color: var(--primary);
  border: 1px solid var(--primary);
}
.btn-secondary:hover { background: var(--primary-light); }
.btn-ghost {
  background: transparent;
  color: var(--slate-500);
  padding: 10px 16px;
}
.btn-ghost:hover { color: var(--slate-900); }

/* ===== UPLOAD ZONE ===== */
.upload-zone {
  border: 1.5px dashed var(--slate-300);
  border-radius: 12px;
  background: white;
  padding: 56px 24px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
}
.upload-zone:hover, .upload-zone.dragover {
  border-color: var(--primary);
  background: var(--primary-light);
}
.upload-zone svg {
  color: var(--slate-400);
}

/* ===== SPINNER ===== */
.spinner {
  width: 32px; height: 32px;
  border: 2.5px solid var(--slate-100);
  border-top-color: var(--slate-400);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== NOTES ===== */
.notes-area {
  width: 100%;
  min-height: 76px;
  padding: 10px 12px;
  border: 1px solid var(--slate-200);
  border-radius: 10px;
  font-size: 14px;
  font-family: inherit;
  color: var(--slate-900);
  resize: vertical;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.notes-area:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(0,123,255,0.08);
}
.notes-area::placeholder { color: var(--slate-400); }

.note-chip {
  background: var(--slate-50);
  border: 1px solid var(--slate-100);
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 13px;
  color: var(--slate-600);
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin-bottom: 6px;
}
.note-chip .remove-note {
  background: none;
  border: none;
  color: var(--slate-400);
  cursor: pointer;
  font-size: 14px;
  line-height: 1;
  padding: 0;
  flex-shrink: 0;
}
.note-chip .remove-note:hover { color: var(--error); }

.add-note-btn {
  background: none;
  border: none;
  color: var(--slate-500);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  padding: 8px 0;
  font-family: inherit;
}
.add-note-btn:hover { color: var(--slate-900); }

/* ===== PREVIEW ===== */
.preview-receipt { background: white; }
.preview-notes { background: var(--slate-50); }

/* ===== SUCCESS ===== */
.success-icon {
  width: 56px; height: 56px;
  border-radius: 50%;
  background: var(--success-light);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 20px;
}
.success-icon svg { width: 28px; height: 28px; color: var(--success); }

/* ===== HISTORY ===== */
.history-card {
  background: white;
  border: 1px solid var(--slate-100);
  border-radius: 12px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  padding: 14px 16px;
  margin-bottom: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: box-shadow 0.15s, border-color 0.15s;
}
.history-card:hover {
  box-shadow: 0 2px 6px rgba(0,0,0,0.05);
  border-color: var(--slate-200);
}

.history-summary {
  background: white;
  border: 1px solid var(--slate-100);
  border-radius: 12px;
  padding: 16px 20px;
  margin-bottom: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.cat-tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 9999px;
  font-size: 11px;
  font-weight: 500;
  background: var(--slate-100);
  color: var(--slate-600);
}

/* ===== MODAL (Bottom Sheet) ===== */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(15,23,42,0.4);
  z-index: 50;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.modal-sheet {
  background: white;
  width: 100%;
  max-width: 512px;
  border-radius: 20px 20px 0 0;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 -4px 24px rgba(0,0,0,0.12);
}
.modal-handle {
  width: 36px; height: 4px;
  background: var(--slate-200);
  border-radius: 2px;
  margin: 8px auto 0;
}
.modal-header {
  position: sticky; top: 0;
  background: white;
  padding: 12px 20px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--slate-100);
  z-index: 1;
}
.modal-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--slate-900);
}
.modal-close {
  width: 30px; height: 30px;
  border-radius: 8px;
  background: var(--slate-100);
  border: none;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  color: var(--slate-500);
  transition: all 0.15s;
}
.modal-close:hover { background: var(--slate-200); color: var(--slate-700); }

/* ===== ANIMATIONS ===== */
.fade-in {
  animation: fadeIn 0.25s ease-out;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

.hidden { display: none !important; }

/* ===== UTILITY ===== */
.text-center { text-align: center; }
.mt-4 { margin-top: 16px; }
.mt-6 { margin-top: 24px; }
.mb-2 { margin-bottom: 8px; }
.mb-4 { margin-bottom: 16px; }
.gap-8 { gap: 8px; }
.flex { display: flex; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.w-full { width: 100%; }
.text-sm { font-size: 14px; }
.text-xs { font-size: 12px; }
.font-medium { font-weight: 500; }
.font-semibold { font-weight: 600; }
.font-bold { font-weight: 700; }
.text-slate-400 { color: var(--slate-400); }
.text-slate-500 { color: var(--slate-500); }
.text-slate-600 { color: var(--slate-600); }
.text-slate-700 { color: var(--slate-700); }
.text-slate-900 { color: var(--slate-900); }
.text-red-500 { color: var(--error); }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>

<div style="max-width:512px;margin:0 auto;padding:20px 16px 100px;">
  <!-- Header -->
  <div class="app-header">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12 12 2.25 21.75 12M4.5 9.75v10.5a.75.75 0 0 0 .75.75h4.5a.75.75 0 0 0 .75-.75V15a.75.75 0 0 1 .75-.75h3a.75.75 0 0 1 .75.75v5.25a.75.75 0 0 0 .75.75h4.5a.75.75 0 0 0 .75-.75V9.75"/>
    </svg>
    <div>
      <div class="title">Receipt Scanner</div>
      <div class="subtitle">Home Passport</div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tab-bar">
    <button id="tabUpload" class="tab-btn active" onclick="switchTab('upload')">上传</button>
    <button id="tabHistory" class="tab-btn" onclick="switchTab('history')">历史记录</button>
  </div>

  <!-- ===== UPLOAD VIEW ===== -->
  <div id="viewUpload">
    <!-- Step indicator -->
    <div class="step-indicator" id="stepIndicator">
      <div class="step-dot active" id="stepDot1">1</div>
      <div class="step-line" id="stepLine1"></div>
      <div class="step-dot" id="stepDot2">2</div>
      <div class="step-line" id="stepLine2"></div>
      <div class="step-dot" id="stepDot3">3</div>
    </div>

    <!-- Step 1: Upload -->
    <div id="step1" class="fade-in">
      <div id="uploadZone" class="upload-zone">
        <svg style="width:32px;height:32px;margin:0 auto 16px;display:block;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0 3 3m-3-3-3 3M6.75 19.5a4.5 4.5 0 0 1-1.41-8.775 5.25 5.25 0 0 1 10.233-2.33 3 3 0 0 1 3.758 3.848A3.752 3.752 0 0 1 18 19.5H6.75Z"/>
        </svg>
        <div style="font-size:14px;font-weight:600;color:var(--slate-700);margin-bottom:4px;">上传收据或发票</div>
        <div style="font-size:13px;color:var(--slate-400);">拍照、选择图片或 PDF</div>
        <input id="fileInput" type="file" accept="image/*,.pdf" capture="environment" style="display:none;">
      </div>

      <!-- Loading -->
      <div id="loadingState" class="hidden">
        <div class="card text-center" style="padding:40px 24px;">
          <div class="spinner"></div>
          <div style="font-size:14px;font-weight:500;color:var(--slate-700);">识别中...</div>
          <div style="font-size:13px;color:var(--slate-400);margin-top:4px;">正在分析收据内容</div>
        </div>
      </div>
    </div>

    <!-- Step 2: Confirm -->
    <div id="step2" class="hidden fade-in">
      <div style="font-size:20px;font-weight:700;color:var(--slate-900);margin-bottom:4px;">确认收据信息</div>
      <div style="font-size:14px;color:var(--slate-400);margin-bottom:24px;">检查并编辑 AI 识别结果</div>

      <!-- Receipt info card -->
      <div class="card">
        <div class="section-label">收据信息</div>

        <div class="field">
          <div class="field-label">日期</div>
          <div class="field-value" data-field="date" onclick="startEdit(this)"></div>
        </div>
        <div class="field">
          <div class="field-label">服务商名称</div>
          <div class="field-value" data-field="vendor.name" onclick="startEdit(this)"></div>
        </div>
        <div class="field">
          <div class="field-label">电话</div>
          <div class="field-value" data-field="vendor.phone" onclick="startEdit(this)"></div>
        </div>
        <div class="field">
          <div class="field-label">地址</div>
          <div class="field-value" data-field="vendor.address" onclick="startEdit(this)"></div>
        </div>
        <div class="field">
          <div class="field-label">总金额</div>
          <div class="field-value" data-field="total" onclick="startEdit(this)"></div>
        </div>
        <div class="field" style="margin-bottom:0;">
          <div class="field-label">明细</div>
          <div id="itemsContainer"></div>
        </div>
      </div>

      <!-- Customer notes card -->
      <div class="card">
        <div class="section-label">添加备注</div>
        <textarea id="noteInput" class="notes-area" placeholder="添加任何不在收据上的额外信息..."></textarea>
        <div id="notesList" style="margin-top:8px;"></div>
        <button onclick="addNote()" class="add-note-btn">+ 添加更多</button>
      </div>

      <!-- Buttons -->
      <div style="display:flex;gap:12px;margin-top:24px;">
        <button class="btn btn-secondary" style="flex:1;" onclick="goToStep(1)">返回</button>
        <button class="btn btn-primary" style="flex:1;" onclick="goToStep(3)">确认并继续</button>
      </div>

    <!-- Step 3: Submit -->
    <div id="step3" class="hidden fade-in">
      <div style="font-size:20px;font-weight:700;color:var(--slate-900);margin-bottom:4px;">确认提交</div>
      <div style="font-size:14px;color:var(--slate-400);margin-bottom:24px;">确认以下信息无误后提交</div>

      <div id="previewContent"></div>

      <!-- Buttons -->
      <div style="display:flex;gap:12px;margin-top:24px;">
        <button class="btn btn-secondary" style="flex:1;" onclick="goToStep(2)">返回修改</button>
        <button class="btn btn-primary" style="flex:1;" onclick="submitReceipt()">提交到 Home Passport</button>
      </div>
    </div>

    <!-- Success -->
    <div id="stepSuccess" class="hidden fade-in" style="text-align:center;padding:48px 0;">
      <div class="success-icon">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/>
        </svg>
      </div>
      <div style="font-size:20px;font-weight:700;color:var(--slate-900);margin-bottom:8px;">提交成功</div>
      <div style="font-size:14px;color:var(--slate-400);margin-bottom:32px;">收据已保存到 Home Passport</div>
      <div style="display:flex;gap:12px;justify-content:center;">
        <button class="btn btn-secondary" onclick="switchTab('history')">查看历史记录</button>
        <button class="btn btn-primary" onclick="resetAll()">上传另一张</button>
      </div>
    </div>
  </div>

  <!-- ===== HISTORY VIEW ===== -->
  <div id="viewHistory" class="hidden">
    <div id="historySummary" class="hidden history-summary">
      <div>
        <div id="summaryCount" style="font-size:13px;font-weight:600;color:var(--slate-700);"></div>
        <div style="font-size:12px;color:var(--slate-400);margin-top:2px;">总支出</div>
      </div>
      <div id="summaryTotal" style="font-size:22px;font-weight:700;color:var(--slate-900);"></div>
    </div>
    <div id="historyList"></div>
    <div id="historyEmpty" style="text-align:center;padding:60px 0;">
      <div style="font-size:14px;color:var(--slate-400);">暂无收据记录</div>
      <div style="font-size:13px;color:var(--slate-300);margin-top:4px;">上传第一张收据开始使用</div>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div id="detailModal" class="hidden modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title">收据详情</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="detailContent" style="padding:16px 20px 24px;"></div>
  </div>
</div>

<script>
const API_KEY = 'AIzaSyAfw5iZ-KEvNK78H9VitHCxaWv_1BpwtMg';
const GEMINI_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`;

// State
let currentStep = 1;
let receiptData = null;
let customerNotes = [];

// ===== TAB SWITCHING =====
function switchTab(tab) {
  const isUpload = tab === 'upload';
  document.getElementById('viewUpload').classList.toggle('hidden', !isUpload);
  document.getElementById('viewHistory').classList.toggle('hidden', isUpload);
  document.getElementById('tabUpload').classList.toggle('active', isUpload);
  document.getElementById('tabHistory').classList.toggle('active', !isUpload);
  if (!isUpload) renderHistory();
}

// ===== STEP NAVIGATION =====
function goToStep(step) {
  // Collect edits before leaving step 2
  if (currentStep === 2 && step === 3) {
    collectStep2Edits();
  }
  currentStep = step;
  document.getElementById('step1').classList.add('hidden');
  document.getElementById('step2').classList.add('hidden');
  document.getElementById('step3').classList.add('hidden');
  document.getElementById('stepSuccess').classList.add('hidden');

  if (step === 1) {
    document.getElementById('step1').classList.remove('hidden');
  } else if (step === 2) {
    document.getElementById('step2').classList.remove('hidden');
    populateStep2();
  } else if (step === 3) {
    document.getElementById('step3').classList.remove('hidden');
    renderPreview();
  }
  updateStepIndicator(step);
}

function updateStepIndicator(step) {
  for (let i = 1; i <= 3; i++) {
    const dot = document.getElementById('stepDot' + i);
    dot.classList.remove('active', 'done');
    if (i < step) dot.classList.add('done');
    else if (i === step) dot.classList.add('active');
  }
  for (let i = 1; i <= 2; i++) {
    const line = document.getElementById('stepLine' + i);
    line.classList.toggle('done', i < step);
  }
}

// ===== STEP 1: UPLOAD =====
const uploadZone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');

uploadZone.addEventListener('click', () => fileInput.click());
uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('dragover'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('dragover');
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => { if (e.target.files.length) handleFile(e.target.files[0]); });

async function handleFile(file) {
  uploadZone.classList.add('hidden');
  document.getElementById('loadingState').classList.remove('hidden');

  try {
    const base64 = await toBase64(file);
    const data = await callGemini(file.type || 'image/jpeg', base64);
    receiptData = normalizeData(data);
    goToStep(2);
  } catch (err) {
    alert('识别失败: ' + err.message);
    resetUpload();
  }
}

function toBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function callGemini(mimeType, base64) {
  const prompt = `You are a receipt/invoice data extraction specialist. Extract all relevant information from this document.

Return ONLY a JSON object with these fields:
{
  "date": "YYYY-MM-DD format",
  "vendor": { "name": "", "phone": "", "address": "" },
  "total": 0.00,
  "category": "one of: Plumbing, Electrical, HVAC, Roofing, Landscaping, Painting, Cleaning, General Maintenance, Other",
  "items": [{ "description": "", "amount": 0 }],
  "confidence": 0.95,
  "currency": "USD",
  "documentType": "receipt|invoice|estimate|other",
  "subtotal": null,
  "tax": null,
  "paymentMethod": null
}

Rules:
- If a field is not clearly visible, set to null or empty string
- Normalize dates to YYYY-MM-DD
- Normalize amounts to numbers (no currency symbol)
- Infer category from vendor name and line items
- confidence is 0-1 estimate of extraction quality`;

  const resp = await fetch(GEMINI_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contents: [{ parts: [
        { text: prompt },
        { inlineData: { mimeType, data: base64 } }
      ]}],
      generationConfig: { responseMimeType: 'application/json', temperature: 0.1 }
    })
  });

  if (!resp.ok) throw new Error(`API error ${resp.status}`);
  const json = await resp.json();
  const text = json.candidates?.[0]?.content?.parts?.[0]?.text;
  if (!text) throw new Error('AI 未返回结果');
  return JSON.parse(text);
}

function normalizeData(data) {
  return {
    date: data.date || '',
    vendor: {
      name: data.vendor?.name || '',
      phone: data.vendor?.phone || '',
      address: data.vendor?.address || ''
    },
    total: data.total || 0,
    category: data.category || 'Other',
    items: (data.items || []).map(it => ({
      description: it.description || '',
      amount: it.amount || it.total || 0
    })),
    confidence: data.confidence || data.confidenceScore || 0,
    currency: data.currency || 'USD',
    documentType: data.documentType || 'receipt',
    subtotal: data.subtotal || null,
    tax: data.tax || null,
    paymentMethod: data.paymentMethod || null
  };
}

function resetUpload() {
  document.getElementById('loadingState').classList.add('hidden');
  uploadZone.classList.remove('hidden');
  fileInput.value = '';
}

// ===== STEP 2: CONFIRM =====
function populateStep2() {
  if (!receiptData) return;
  const d = receiptData;

  setFieldValue('date', d.date || '');
  setFieldValue('vendor.name', d.vendor.name || '');
  setFieldValue('vendor.phone', d.vendor.phone || '');
  setFieldValue('vendor.address', d.vendor.address || '');
  setFieldValue('total', d.total != null ? String(d.total) : '');

  // Items
  const container = document.getElementById('itemsContainer');
  container.innerHTML = '';
  d.items.forEach((item, i) => {
    container.innerHTML += `
      <div class="item-row">
        <div class="item-desc field-value" data-field="items.${i}.description" onclick="startEdit(this)">${esc(item.description || '—')}</div>
        <div class="item-amount field-value" data-field="items.${i}.amount" onclick="startEdit(this)" style="text-align:right;min-width:80px;">${fmtMoney(item.amount)}</div>
      </div>`;
  });

  // Reset notes
  customerNotes = [];
  document.getElementById('noteInput').value = '';
  document.getElementById('notesList').innerHTML = '';
}

function setFieldValue(field, value) {
  const el = document.querySelector(`[data-field="${field}"]`);
  if (el) el.textContent = value || '—';
}

function startEdit(el) {
  if (el.classList.contains('editing')) return;
  el.classList.add('editing');
  el.contentEditable = true;
  el.focus();

  // Select all text
  const range = document.createRange();
  range.selectNodeContents(el);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);

  const finish = () => {
    el.contentEditable = false;
    el.classList.remove('editing');
    if (!el.textContent.trim()) el.textContent = '—';
    el.removeEventListener('blur', finish);
    el.removeEventListener('keydown', handleKey);
  };
  const handleKey = (e) => {
    if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
    if (e.key === 'Escape') { el.blur(); }
  };
  el.addEventListener('blur', finish);
  el.addEventListener('keydown', handleKey);
}

function addNote() {
  const input = document.getElementById('noteInput');
  const text = input.value.trim();
  if (!text) return;
  customerNotes.push(text);
  input.value = '';
  renderNotes();
}

function removeNote(index) {
  customerNotes.splice(index, 1);
  renderNotes();
}

function renderNotes() {
  const list = document.getElementById('notesList');
  list.innerHTML = customerNotes.map((note, i) => `
    <div class="note-chip">
      <span style="flex:1;">${esc(note)}</span>
      <button class="remove-note" onclick="removeNote(${i})">✕</button>
    </div>
  `).join('');
}

function collectStep2Edits() {
  if (!receiptData) return;
  document.querySelectorAll('#step2 .field-value').forEach(el => {
    const field = el.getAttribute('data-field');
    if (!field) return;
    const val = el.textContent.trim();
    if (val === '—') return;

    if (field.startsWith('items.')) {
      const parts = field.split('.');
      const idx = parseInt(parts[1]);
      const key = parts[2];
      if (receiptData.items[idx]) {
        receiptData.items[idx][key] = key === 'amount' ? parseFloat(val) || 0 : val;
      }
    } else if (field.startsWith('vendor.')) {
      receiptData.vendor[field.split('.')[1]] = val;
    } else if (field === 'total') {
      receiptData.total = parseFloat(val) || 0;
    } else {
      receiptData[field] = val;
    }
  });

  // Check if there's text in the note input that hasn't been added
  const input = document.getElementById('noteInput');
  if (input.value.trim()) {
    customerNotes.push(input.value.trim());
    input.value = '';
    renderNotes();
  }
}

// ===== STEP 3: PREVIEW =====
function renderPreview() {
  if (!receiptData) return;
  const d = receiptData;

  const receiptSection = `
    <div class="card preview-receipt">
      <div class="section-label">收据信息</div>
      <div style="display:grid;gap:14px;">
        ${fieldRow('日期', d.date || '—')}
        ${fieldRow('服务商', d.vendor.name || '—')}
        ${fieldRow('电话', d.vendor.phone || '—')}
        ${fieldRow('地址', d.vendor.address || '—')}
        ${fieldRow('类别', d.category)}
        ${fieldRow('总金额', fmtMoney(d.total, d.currency))}
      </div>
      ${d.items.length ? `
        <div style="margin-top:16px;border-top:1px solid var(--slate-100);padding-top:12px;">
          <div style="font-size:12px;font-weight:500;color:var(--slate-400);margin-bottom:8px;">明细</div>
          ${d.items.map(it => `
            <div class="item-row">
              <span class="item-desc">${esc(it.description || '—')}</span>
              <span class="item-amount">${fmtMoney(it.amount)}</span>
            </div>
          `).join('')}
        </div>
      ` : ''}
    </div>
  `;

  const notesSection = customerNotes.length ? `
    <div class="card preview-notes">
      <div class="section-label">客户备注</div>
      ${customerNotes.map(n => `<div style="font-size:14px;color:var(--slate-600);margin-bottom:6px;">${esc(n)}</div>`).join('')}
    </div>
  ` : '';

  document.getElementById('previewContent').innerHTML = receiptSection + notesSection;
}

function fieldRow(label, value) {
  return `<div>
    <div style="font-size:12px;color:var(--slate-400);margin-bottom:2px;">${label}</div>
    <div style="font-size:15px;color:var(--slate-900);">${value}</div>
  </div>`;
}

// ===== SUBMIT =====
function submitReceipt() {
  if (!receiptData) return;
  const history = JSON.parse(localStorage.getItem('hp_receipts') || '[]');
  const entry = {
    ...receiptData,
    customerNotes: [...customerNotes],
    savedAt: new Date().toISOString()
  };
  history.unshift(entry);
  localStorage.setItem('hp_receipts', JSON.stringify(history));

  // Show success
  document.getElementById('step3').classList.add('hidden');
  document.getElementById('stepIndicator').classList.add('hidden');
  document.getElementById('stepSuccess').classList.remove('hidden');
}

function resetAll() {
  receiptData = null;
  customerNotes = [];
  fileInput.value = '';
  document.getElementById('stepSuccess').classList.add('hidden');
  document.getElementById('stepIndicator').classList.remove('hidden');
  document.getElementById('loadingState').classList.add('hidden');
  uploadZone.classList.remove('hidden');
  goToStep(1);
}

// ===== HISTORY =====
function renderHistory() {
  const history = JSON.parse(localStorage.getItem('hp_receipts') || '[]');
  const list = document.getElementById('historyList');
  const empty = document.getElementById('historyEmpty');
  const summary = document.getElementById('historySummary');

  if (!history.length) {
    list.innerHTML = '';
    empty.classList.remove('hidden');
    summary.classList.add('hidden');
    return;
  }
  empty.classList.add('hidden');

  const total = history.reduce((s, r) => s + (r.total || 0), 0);
  document.getElementById('summaryCount').textContent = `${history.length} 张收据`;
  document.getElementById('summaryTotal').textContent = fmtMoney(total);
  summary.classList.remove('hidden');

  list.innerHTML = history.map((r, i) => {
    const date = r.date ? formatDate(r.date) : '';
    return `
      <div class="history-card fade-in" style="animation-delay:${i * 30}ms" onclick="showDetail(${i})">
        <div style="flex:1;min-width:0;">
          <div style="font-size:15px;font-weight:600;color:var(--slate-900);" class="truncate">${esc(r.vendor?.name || r.category || '收据')}</div>
          <div style="font-size:13px;color:var(--slate-400);margin-top:2px;">${date}</div>
        </div>
        <div style="text-align:right;flex-shrink:0;margin-left:12px;display:flex;flex-direction:column;align-items:flex-end;gap:4px;">
          <div style="font-size:15px;font-weight:600;color:var(--slate-900);">${fmtMoney(r.total, r.currency)}</div>
          <span class="cat-tag">${esc(r.category || 'Other')}</span>
        </div>
      </div>
    `;
  }).join('');
}

function showDetail(index) {
  const history = JSON.parse(localStorage.getItem('hp_receipts') || '[]');
  const r = history[index];
  if (!r) return;

  const date = r.date ? formatDate(r.date) : '';

  let html = `
    <div class="card" style="margin-bottom:8px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;">
        <div>
          <div style="font-size:18px;font-weight:700;color:var(--slate-900);">${esc(r.vendor?.name || '未知')}</div>
          <div style="font-size:13px;color:var(--slate-400);margin-top:2px;">${date}</div>
        </div>
        <div style="font-size:22px;font-weight:700;color:var(--slate-900);">${fmtMoney(r.total, r.currency)}</div>
      </div>
      <div style="display:grid;gap:12px;">
        ${r.vendor?.phone ? fieldRow('电话', r.vendor.phone) : ''}
        ${r.vendor?.address ? fieldRow('地址', esc(r.vendor.address)) : ''}
        ${fieldRow('类别', r.category || 'Other')}
        ${r.documentType ? fieldRow('类型', r.documentType) : ''}
        ${r.paymentMethod ? fieldRow('支付方式', esc(r.paymentMethod)) : ''}
      </div>
    </div>
  `;

  if (r.items?.length) {
    html += `
      <div class="card" style="margin-bottom:8px;">
        <div class="section-label">明细</div>
        ${r.items.map(it => `
          <div class="item-row">
            <span class="item-desc">${esc(it.description || '—')}</span>
            <span class="item-amount">${fmtMoney(it.amount)}</span>
          </div>
        `).join('')}
        ${r.subtotal != null ? `<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--slate-500);margin-top:8px;padding-top:8px;border-top:1px solid var(--slate-100);"><span>小计</span><span>${fmtMoney(r.subtotal, r.currency)}</span></div>` : ''}
        ${r.tax != null ? `<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--slate-500);"><span>税费</span><span>${fmtMoney(r.tax, r.currency)}</span></div>` : ''}
      </div>
    `;
  }

  if (r.customerNotes?.length) {
    html += `
      <div class="card preview-notes" style="margin-bottom:8px;">
        <div class="section-label">客户备注</div>
        ${r.customerNotes.map(n => `<div style="font-size:14px;color:var(--slate-600);margin-bottom:4px;">${esc(n)}</div>`).join('')}
      </div>
    `;
  }

  html += `
    <button onclick="deleteReceipt(${index})" style="width:100%;padding:12px;background:none;border:none;color:var(--error);font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;border-radius:12px;margin-top:4px;transition:background 0.15s;" onmouseover="this.style.background='var(--error-light)'" onmouseout="this.style.background='transparent'">删除收据</button>
  `;

  document.getElementById('detailContent').innerHTML = html;
  document.getElementById('detailModal').classList.remove('hidden');
}

function closeModal() {
  document.getElementById('detailModal').classList.add('hidden');
}

function deleteReceipt(index) {
  if (!confirm('确定删除这张收据？')) return;
  const history = JSON.parse(localStorage.getItem('hp_receipts') || '[]');
  history.splice(index, 1);
  localStorage.setItem('hp_receipts', JSON.stringify(history));
  closeModal();
  renderHistory();
}

// ===== HELPERS =====
function formatDate(dateStr) {
  try {
    const d = new Date(dateStr + 'T00:00:00');
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  } catch { return dateStr; }
}

function fmtMoney(amount, currency) {
  if (amount == null) return '—';
  const sym = currency === 'EUR' ? '€' : currency === 'GBP' ? '£' : '$';
  return sym + Number(amount).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function esc(str) {
  if (!str) return '';
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}
