<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<script src="/sky-portal/access-gate.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>创作 — 墨记</title>
  <meta name="description" content="用AI把你的想法变成精美网页">

  <!-- Open Graph -->
  <meta property="og:title" content="墨记 — 开始创作">
  <meta property="og:description" content="用AI把你的想法变成精美网页">
  <meta property="og:type" content="website">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;600;700&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- 样式 -->
  <link rel="stylesheet" href="../styles/global.css">
  <link rel="stylesheet" href="../styles/create.css">
</head>
<body>
  <!-- Lucide Icons (必须在 nav.js 之前加载) -->
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script>
  if (typeof lucide !== 'undefined') {
    // nav.js 会调用 createIcons，这里不重复
  } else {
    document.addEventListener('DOMContentLoaded', function() {
      document.querySelectorAll('[data-lucide]').forEach(function(el) {
        el.textContent = el.getAttribute('data-fallback') || '';
        el.style.display = 'inline-block';
      });
    });
  }
  </script>
  <!-- 导航由 nav.js 自动注入 -->
  <script src="../components/nav.js"></script>

  <div class="create-page">

    <!-- ====== 页面标题 ====== -->
    <h1 class="create-page__title">开始创作</h1>
    <p class="create-page__subtitle">输入想法，AI 帮你生成精美网页</p>

    <!-- ====== 步骤指示器 ====== -->
    <div class="step-indicator">
      <div class="step-indicator__step active">
        <div class="step-indicator__step-inner">
          <div class="step-indicator__circle">1</div>
          <span class="step-indicator__label">输入</span>
        </div>
      </div>
      <div class="step-indicator__line"></div>
      <div class="step-indicator__step">
        <div class="step-indicator__step-inner">
          <div class="step-indicator__circle">2</div>
          <span class="step-indicator__label">生成</span>
        </div>
      </div>
      <div class="step-indicator__line"></div>
      <div class="step-indicator__step">
        <div class="step-indicator__step-inner">
          <div class="step-indicator__circle">3</div>
          <span class="step-indicator__label">预览</span>
        </div>
      </div>
      <div class="step-indicator__line"></div>
      <div class="step-indicator__step">
        <div class="step-indicator__step-inner">
          <div class="step-indicator__circle">4</div>
          <span class="step-indicator__label">发布</span>
        </div>
      </div>
    </div>

    <!-- ============================================================
         Step 1: 输入
         ============================================================ -->
    <div class="step-panel active" id="step1">
      <!-- 文字输入区域 -->
      <div class="input-area">
        <textarea
          class="input-area__textarea"
          id="inputText"
          placeholder="在这里写下你的想法、故事、知识笔记……&#10;&#10;可以是一段感悟、一个项目的介绍、学到的知识点……&#10;AI 会帮你自动排版成精美的网页。"
        ></textarea>
        <div class="input-area__footer">
          <span class="input-area__hint">💡 支持一句话、一段话、甚至一整篇文章</span>
          <span class="input-area__count">0 / 5000 字</span>
        </div>
      </div>

      <!-- 文件上传区 -->
      <div class="upload-area" id="uploadArea">
        <div class="upload-zone" id="uploadZone" role="button" aria-label="点击或拖拽上传文件" tabindex="0">
          <div class="upload-zone__icon">📤</div>
          <p class="upload-zone__text">拖拽或点击上传图片、PDF、文本文件</p>
          <p class="upload-zone__hint">支持 JPG、PNG、GIF、PDF、TXT、MD</p>
          <input type="file" id="fileInput" multiple accept="image/*,.pdf,.txt,.md" style="display:none;">
        </div>
        <p id="uploadStatus" class="upload-status" style="color:#e85d26;font-size:0.85rem;min-height:1.2em;margin-top:4px;"></p>
        <div id="filePreviewList" class="file-preview-list"></div>
      </div>

      <!-- 生成按钮 -->
      <button class="create-btn" id="generateBtn" disabled>
        ✨ AI 生成网页
      </button>
      <p id="generateBtnHint" class="generate-btn-hint" style="display:none;"></p>
    </div>

    <!-- ============================================================
         Step 2: AI 生成中
         ============================================================ -->
    <div class="step-panel" id="step2">
      <div class="generating-panel">
        <!-- 呼吸光球 -->
        <div class="generating-panel__orb"></div>
        <p class="generating-panel__text">AI 正在理解你的内容...</p>
        <p class="generating-panel__sub">这通常只需要几秒钟</p>
        <div class="generating-panel__dots">
          <div class="generating-panel__dot"></div>
          <div class="generating-panel__dot"></div>
          <div class="generating-panel__dot"></div>
        </div>
      </div>
    </div>

    <!-- ============================================================
         Step 3: 预览 + 风格选择 + 编辑
         ============================================================ -->
    <div class="step-panel" id="step3">

      <!-- 风格切换 -->
      <div class="style-switcher">
        <button class="style-switcher__btn active" data-style="minimal">
          <span class="style-switcher__icon">🎯</span>
          <span class="style-switcher__name">简约</span>
          <span class="style-switcher__desc">干净 · 留白 · Medium风</span>
        </button>
        <button class="style-switcher__btn" data-style="vibrant">
          <span class="style-switcher__icon">🌊</span>
          <span class="style-switcher__name">活泼</span>
          <span class="style-switcher__desc">渐变 · 圆角 · 小红书风</span>
        </button>
        <button class="style-switcher__btn" data-style="dark">
          <span class="style-switcher__icon">🖤</span>
          <span class="style-switcher__name">酷感</span>
          <span class="style-switcher__desc">深色 · 大胆 · Apple风</span>
        </button>
      </div>

      <!-- 预览框架 -->
      <div class="preview-frame">
        <iframe id="previewFrame" title="网页预览"></iframe>
      </div>

      <!-- HTML 编辑器（可折叠） -->
      <div class="html-editor" id="htmlEditor">
        <div class="html-editor__header">
          <h3 class="html-editor__title">
            <i data-lucide="code-2" data-fallback="💻" style="width:16px;height:16px"></i>
            HTML 编辑器
          </h3>
          <div class="html-editor__actions">
            <button class="html-editor__btn" id="editorApplyBtn" title="应用修改">
              <i data-lucide="check" data-fallback="✓" style="width:14px;height:14px"></i>
              应用
            </button>
            <button class="html-editor__btn html-editor__btn--close" id="editorCloseBtn" title="关闭编辑器">
              <i data-lucide="x" data-fallback="✕" style="width:14px;height:14px"></i>
            </button>
          </div>
        </div>
        <textarea
          class="html-editor__code"
          id="htmlCodeEditor"
          spellcheck="false"
          placeholder="<!-- 在这里编辑HTML内容 -->"
        ></textarea>
      </div>

      <!-- 操作按钮 -->
      <div class="preview-actions">
        <button class="btn btn-secondary" id="editToggleBtn">
          <i data-lucide="code-2" data-fallback="💻" style="width:16px;height:16px"></i>
          编辑 HTML
        </button>
        <button class="btn btn-secondary" id="regenBtn">
          <i data-lucide="refresh-cw" data-fallback="🔄" style="width:16px;height:16px"></i>
          重新生成
        </button>
        <button class="btn btn-primary" id="publishBtn">
          <i data-lucide="send" data-fallback="📤" style="width:16px;height:16px"></i>
          发布网页
        </button>
      </div>
    </div>

    <!-- ============================================================
         Step 4: 发布确认
         ============================================================ -->
    <div class="step-panel" id="step4">
      <div class="publish-panel">

        <!-- 成功图标 -->
        <div class="publish-panel__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>

        <h2 class="publish-panel__title">发布成功！</h2>
        <p class="publish-panel__sub">你的网页已经上线，分享给朋友吧</p>

        <!-- 链接 -->
        <div class="publish-link">
          <span class="publish-link__url" id="publishUrl">https://moji.app/s/...</span>
          <button class="publish-link__copy" id="copyBtn">复制链接</button>
        </div>

        <!-- 密码保护 -->
        <div class="publish-password">
          <label class="publish-password__toggle">
            <input type="checkbox" id="passwordToggle">
            <span class="publish-password__checkmark"></span>
            <span class="publish-password__label">密码保护</span>
          </label>
          <div class="publish-password__field" id="passwordField">
            <input type="password" class="publish-password__input" id="passwordInput" placeholder="设置访问密码..." readonly>
            <button class="publish-password__save" id="passwordSaveBtn">保存密码</button>
          </div>
        </div>

        <!-- 社交分享 -->
        <div class="publish-share">
          <button class="publish-share__btn" data-platform="wechat" title="分享到微信">💬</button>
          <button class="publish-share__btn" data-platform="weibo" title="分享到微博">📰</button>
          <button class="publish-share__btn" data-platform="twitter" title="分享到 Twitter">🐦</button>
        </div>

        <!-- 返回 -->
        <button class="btn-back" id="backBtn">← 继续创作</button>
      </div>
    </div>

  </div><!-- /.create-page -->

  <!-- Footer -->
  <footer class="site-footer">
    <p>墨记 &copy; 2026 — 让想法被看见</p>
    <p class="mt-1" style="font-size:0.85rem;">
      <a href="javascript:void(0)">隐私政策</a> · <a href="javascript:void(0)">使用条款</a> · <a href="javascript:void(0)">联系我们</a>
    </p>
  </footer>

  <!-- pdf.js CDN（PDF文本提取） -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    if (typeof pdfjsLib !== 'undefined') {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
  </script>
  <!-- 配置 -->
  <script src="../config.js"></script>
  <!-- 存储层 -->
  <script src="../utils/storage.js"></script>
  <!-- 逻辑脚本 -->
  <script src="../utils/create-logic.js"></script>
</body>
</html>
