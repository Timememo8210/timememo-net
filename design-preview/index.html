<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>陈晓波 · 四种主页方案</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css?v=1">
<script defer src="assets/directory.js?v=1"></script>
<script defer src="assets/app.js?v=1"></script>
</head>
<body class="locked" data-style="editorial" data-motion="on">
<section class="access" aria-labelledby="access-title">
 <form id="access-form" class="access-card">
  <p class="eyebrow">TIMEMEMO / PRIVATE PREVIEW</p>
  <h1 id="access-title">四种新的<br>主页方向。</h1>
  <p>输入网站密码，打开完整动态预览。</p>
  <label for="access-password">访问密码</label>
  <div class="access-field"><input id="access-password" type="password" inputmode="numeric" autocomplete="current-password" required><button type="submit">进入 →</button></div>
  <p id="access-error" role="alert"></p>
 </form>
</section>
<div id="preview" inert>
 <header class="preview-toolbar" aria-label="方案选择">
  <a class="preview-home" href="https://timememo.net/?v=20260906">← 正式主页</a>
  <div class="style-switch" role="group" aria-label="切换主页方案">
   <button data-choice="editorial" aria-pressed="true">A <span>人物杂志</span></button>
   <button data-choice="swiss" aria-pressed="false">B <span>瑞士设计</span></button>
   <button data-choice="noir" aria-pressed="false">C <span>深色纪实</span></button>
   <button data-choice="studio" aria-pressed="false">D <span>现代工作室</span></button>
  </div>
  <div class="preview-tools"><button id="language" aria-label="Switch to English">EN</button><button id="motion" aria-pressed="false">暂停动效</button></div>
 </header>
 <div id="site"></div>
</div>
<noscript><style>#access-form{display:none}</style><p style="padding:2rem">请启用 JavaScript 后查看动态方案。</p></noscript>
</body>
</html>
