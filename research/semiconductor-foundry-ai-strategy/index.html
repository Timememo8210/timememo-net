<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="referrer" content="no-referrer">
  <title>半导体代工 AI 策略 | timememo.net</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --ink: #17201d;
      --muted: #66736d;
      --paper: #f7faf6;
      --surface: #ffffff;
      --surface-soft: #eef7f2;
      --line: #d6e0dc;
      --line-strong: #17201d;
      --teal: #1d8b7a;
      --blue: #2867c8;
      --lime: #c9f25d;
      --aqua: #aeece4;
      --coral: #ff866f;
      --yellow: #ffe58a;
      --violet: #7666ff;
      --shadow: 0 18px 60px rgba(33, 54, 48, 0.12);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(135deg, rgba(201, 242, 93, 0.22), transparent 32rem),
        linear-gradient(225deg, rgba(174, 236, 228, 0.34), transparent 30rem),
        linear-gradient(90deg, rgba(23, 32, 29, 0.045) 1px, transparent 1px),
        linear-gradient(rgba(23, 32, 29, 0.04) 1px, transparent 1px),
        var(--paper);
      background-size: auto, auto, 32px 32px, 32px 32px, auto;
      color: var(--ink);
      font-family: "IBM Plex Sans", "Source Sans 3", sans-serif;
      letter-spacing: 0;
    }

    a {
      color: inherit;
    }

    button {
      font: inherit;
    }

    h1,
    h2,
    h3,
    p,
    li,
    a,
    td,
    th,
    .nav-link,
    .meta-text {
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .shell {
      width: min(1280px, calc(100% - 32px));
      margin: 0 auto;
      padding: 18px 0 56px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      padding: 12px 0;
      background: color-mix(in srgb, var(--paper) 92%, transparent);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
    }

    .back {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--ink);
      font-family: "IBM Plex Mono", monospace;
      font-size: 13px;
      font-weight: 700;
      padding: 8px 12px;
      text-decoration: none;
      box-shadow: 0 8px 20px rgba(33, 54, 48, 0.08);
    }

    .meta-text {
      color: var(--muted);
      font-family: "IBM Plex Mono", monospace;
      font-size: 12px;
      line-height: 1.45;
      text-align: center;
    }

    .language-switch {
      display: inline-flex;
      gap: 3px;
      padding: 3px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: 0 8px 20px rgba(33, 54, 48, 0.08);
    }

    .language-switch button {
      min-width: 58px;
      min-height: 32px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-family: "IBM Plex Mono", monospace;
      font-size: 12px;
      font-weight: 700;
    }

    .language-switch button[aria-pressed="true"] {
      background: var(--ink);
      color: var(--surface);
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(330px, 0.66fr);
      gap: 24px;
      align-items: stretch;
      padding: 34px 0 26px;
    }

    .hero-copy {
      min-width: 0;
      display: grid;
      align-content: center;
      gap: 18px;
      padding: 24px 0;
    }

    .kicker {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      background: var(--lime);
      padding: 7px 12px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 12px;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      max-width: 850px;
      font-size: clamp(42px, 6.1vw, 78px);
      line-height: 0.98;
      font-weight: 700;
    }

    .lead {
      margin: 0;
      max-width: 820px;
      color: #34413c;
      font-size: 19px;
      line-height: 1.68;
    }

    .quick-read {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 4px;
    }

    .metric {
      min-width: 0;
      min-height: 112px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: color-mix(in srgb, var(--surface) 92%, var(--aqua));
      padding: 15px;
      box-shadow: 0 10px 28px rgba(33, 54, 48, 0.08);
    }

    .metric strong {
      display: block;
      font-family: "IBM Plex Mono", monospace;
      font-size: 30px;
      line-height: 1;
    }

    .metric span {
      display: block;
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .fab-card {
      position: relative;
      min-width: 0;
      min-height: 430px;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background:
        radial-gradient(circle at 72% 42%, rgba(255, 229, 138, 0.82), transparent 0 12%, transparent 20%),
        linear-gradient(145deg, rgba(174, 236, 228, 0.75), rgba(255, 255, 255, 0.94) 48%, rgba(201, 242, 93, 0.36)),
        var(--surface);
      box-shadow: var(--shadow);
      padding: 22px;
    }

    .fab-visual {
      position: absolute;
      right: -72px;
      bottom: -62px;
      width: min(480px, 88vw);
      aspect-ratio: 1;
      border: 1px solid rgba(23, 32, 29, 0.38);
      border-radius: 50%;
      background:
        linear-gradient(90deg, rgba(23, 32, 29, 0.09) 1px, transparent 1px),
        linear-gradient(rgba(23, 32, 29, 0.09) 1px, transparent 1px),
        repeating-radial-gradient(circle, rgba(40, 103, 200, 0.12) 0 2px, transparent 2px 21px),
        #fafff8;
      background-size: 30px 30px, 30px 30px, auto, auto;
      transform: rotate(-12deg);
    }

    .fab-visual::before,
    .fab-visual::after {
      content: "";
      position: absolute;
      border-radius: 50%;
    }

    .fab-visual::before {
      inset: 18%;
      border: 2px dashed rgba(29, 139, 122, 0.52);
    }

    .fab-visual::after {
      inset: 39%;
      border: 1px solid rgba(255, 134, 111, 0.72);
      background: rgba(255, 255, 255, 0.45);
    }

    .fab-node {
      position: absolute;
      width: 13px;
      height: 13px;
      border: 2px solid var(--ink);
      border-radius: 50%;
      background: var(--coral);
      box-shadow: 0 0 0 6px rgba(255, 134, 111, 0.18);
    }

    .fab-node:nth-child(1) {
      left: 28%;
      top: 27%;
    }

    .fab-node:nth-child(2) {
      left: 57%;
      top: 21%;
      background: var(--lime);
      box-shadow: 0 0 0 6px rgba(201, 242, 93, 0.22);
    }

    .fab-node:nth-child(3) {
      left: 68%;
      top: 62%;
      background: var(--aqua);
      box-shadow: 0 0 0 6px rgba(174, 236, 228, 0.3);
    }

    .fab-node:nth-child(4) {
      left: 43%;
      top: 50%;
      background: var(--yellow);
      box-shadow: 0 0 0 6px rgba(255, 229, 138, 0.22);
    }

    .fab-copy {
      position: relative;
      z-index: 1;
      max-width: 310px;
    }

    .fab-copy h2 {
      margin: 0;
      font-size: 28px;
      line-height: 1.08;
    }

    .fab-copy p {
      margin: 10px 0 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .chip-tags {
      position: absolute;
      left: 22px;
      right: 22px;
      bottom: 22px;
      z-index: 2;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip-tags span,
    .pill {
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.88);
      padding: 6px 9px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 12px;
      font-weight: 700;
    }

    .page-grid {
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr);
      gap: 22px;
      align-items: start;
    }

    .side-nav {
      position: sticky;
      top: 72px;
      display: grid;
      gap: 14px;
      min-width: 0;
    }

    .nav-panel,
    .section {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 14px 40px rgba(33, 54, 48, 0.08);
    }

    .nav-panel {
      padding: 12px;
    }

    .nav-label {
      display: block;
      margin: 0 0 8px;
      color: var(--muted);
      font-family: "IBM Plex Mono", monospace;
      font-size: 12px;
      font-weight: 700;
    }

    .nav-list {
      display: grid;
      gap: 4px;
    }

    .nav-link {
      display: flex;
      align-items: center;
      min-height: 36px;
      border-radius: 6px;
      color: #4d5d56;
      font-family: "IBM Plex Mono", monospace;
      font-size: 13px;
      font-weight: 700;
      padding: 7px 9px;
      text-decoration: none;
    }

    .nav-link:hover,
    .nav-link:focus {
      background: var(--surface-soft);
      color: var(--ink);
    }

    .nav-foot {
      padding: 14px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .content {
      display: grid;
      gap: 22px;
      min-width: 0;
    }

    section {
      scroll-margin-top: 84px;
    }

    .section {
      min-width: 0;
      padding: 22px;
    }

    .section h2 {
      margin: 0 0 16px;
      font-size: clamp(26px, 3.5vw, 38px);
      line-height: 1.08;
    }

    .section h3 {
      margin: 0 0 10px;
      font-size: 20px;
      line-height: 1.2;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .take,
    .company,
    .watch,
    .event,
    .matrix-card {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .take {
      padding: 16px;
    }

    .take strong {
      display: block;
      margin-bottom: 8px;
      font-size: 18px;
      line-height: 1.25;
    }

    .take p,
    .company li,
    .event p,
    .watch p,
    .note {
      margin: 0;
      color: #35443f;
      line-height: 1.6;
    }

    .matrix {
      display: grid;
      gap: 12px;
    }

    .matrix-head {
      display: grid;
      grid-template-columns: 190px minmax(0, 1fr) minmax(0, 1fr);
      gap: 12px;
      color: var(--muted);
      font-family: "IBM Plex Mono", monospace;
      font-size: 12px;
      font-weight: 700;
      padding: 0 6px;
    }

    .matrix-row {
      display: grid;
      grid-template-columns: 190px minmax(0, 1fr) minmax(0, 1fr);
      gap: 12px;
      align-items: stretch;
    }

    .matrix-card {
      padding: 14px;
      line-height: 1.55;
    }

    .stage {
      border-color: color-mix(in srgb, var(--teal) 55%, var(--line));
      background: linear-gradient(135deg, var(--surface-soft), #ffffff);
      font-weight: 700;
    }

    .company-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .company {
      padding: 18px;
      border-top: 6px solid var(--teal);
    }

    .company.samsung {
      border-top-color: var(--blue);
    }

    .bullets {
      margin: 0;
      padding-left: 20px;
    }

    .bullets li + li {
      margin-top: 8px;
    }

    .timeline {
      display: grid;
      gap: 12px;
    }

    .event {
      display: grid;
      grid-template-columns: 118px minmax(0, 1fr);
      gap: 14px;
      padding: 14px;
      border-left: 5px solid var(--coral);
    }

    .event time {
      color: var(--blue);
      font-family: "IBM Plex Mono", monospace;
      font-weight: 700;
    }

    .watch-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .watch {
      padding: 16px;
      min-height: 152px;
    }

    .watch span {
      display: inline-block;
      margin-bottom: 9px;
      border-radius: 999px;
      background: var(--yellow);
      color: var(--ink);
      padding: 4px 9px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 12px;
      font-weight: 700;
    }

    .note {
      margin-top: 14px;
      color: var(--muted);
      font-size: 14px;
    }

    .sources {
      display: grid;
      gap: 9px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .sources a {
      color: var(--blue);
      line-height: 1.45;
    }

    @media (max-width: 980px) {
      .hero,
      .page-grid,
      .summary-grid,
      .company-grid,
      .watch-grid {
        grid-template-columns: minmax(0, 1fr);
      }

      .hero {
        padding-top: 22px;
      }

      .side-nav {
        position: static;
      }

      .nav-list {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .matrix-head {
        display: none;
      }

      .matrix-row {
        grid-template-columns: minmax(0, 1fr);
        gap: 8px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        padding: 10px;
      }

      .matrix-card {
        border: 0;
        background: transparent;
        padding: 6px;
      }
    }

    @media (max-width: 640px) {
      .shell {
        width: min(100% - 22px, 1280px);
        padding-top: 0;
      }

      .topbar {
        grid-template-columns: minmax(0, 1fr);
        gap: 9px;
        align-items: stretch;
      }

      .meta-text {
        text-align: left;
      }

      .language-switch {
        width: 100%;
      }

      .language-switch button {
        flex: 1;
      }

      h1 {
        font-size: 36px;
        line-height: 1.05;
      }

      .lead {
        font-size: 17px;
        line-height: 1.65;
      }

      .quick-read,
      .nav-list,
      .event {
        grid-template-columns: minmax(0, 1fr);
      }

      .fab-card {
        min-height: 440px;
        padding: 18px;
      }

      .fab-visual {
        right: -165px;
        bottom: -55px;
      }

      .chip-tags {
        left: 18px;
        right: 18px;
        bottom: 18px;
      }

      .section {
        padding: 16px;
      }
    }
  </style>
</head>

    <div class="page-grid">
      <aside class="side-nav" aria-label="Report navigation">
        <div class="nav-panel">
          <span class="nav-label" data-i18n="navLabel"></span>

      <div class="content">

          <h2 data-i18n="samsungTitle"></h2>
          <div class="company-grid" id="samsungGrid"></div>
        </section>

        <section class="section" id="timeline">
          <h2 data-i18n="timelineTitle"></h2>
          <div class="timeline" id="timelineList"></div>

        <section class="section" id="watch">

      </div>
    </div>
  </main>

        </div>
      `).join("");

      byId("navList").innerHTML = data.nav.map(([id, label]) => `
        <a class="nav-link" href="#${id}">${escapeHtml(label)}</a>
      `).join("");

      byId("summaryGrid").innerHTML = renderCards(data.summary);

      byId("matrixGrid").innerHTML = `
        <div class="matrix-head">
          ${data.matrixHeaders.map((item) => `<div>${escapeHtml(item)}</div>`).join("")}
        </div>
        ${data.matrix.map((row) => `
          <div class="matrix-row">
            <div class="matrix-card stage">${escapeHtml(row[0])}</div>
            <div class="matrix-card">${escapeHtml(row[1])}</div>
            <div class="matrix-card">${escapeHtml(row[2])}</div>
          </div>
        `).join("")}
      `;

      byId("tsmcGrid").innerHTML = renderCompany(data.tsmc, "tsmc");
      byId("samsungGrid").innerHTML = renderCompany(data.samsung, "samsung");

      byId("timelineList").innerHTML = data.timeline.map(([date, body]) => `
        <article class="event">
          <time>${escapeHtml(date)}</time>
          <p>${escapeHtml(body)}</p>
        </article>
      `).join("");

      byId("watchGrid").innerHTML = data.watch.map(([label, body]) => `
        <article class="watch">
          <span>${escapeHtml(label)}</span>
          <p>${escapeHtml(body)}</p>
        </article>
      `).join("");

      byId("sourcesList").innerHTML = data.sources.map(([label, url]) => `
        <li><a href="${escapeHtml(url)}" target="_blank" rel="noreferrer">${escapeHtml(label)}</a></li>
      `).join("");

      document.querySelectorAll("[data-lang]").forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.lang === lang));
      });

      localStorage.setItem("foundry-ai-lang", lang);
    }

    document.querySelectorAll("[data-lang]").forEach((button) => {
      button.addEventListener("click", () => renderLanguage(button.dataset.lang));
    });

    renderLanguage(localStorage.getItem("foundry-ai-lang") || "zh");
  </script>
</body>
</html>
