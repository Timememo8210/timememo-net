<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="title description">
  <title id="title">TREFLEUR four-leaf mark</title>
  <desc id="description">Four square-set deep green heart-shaped leaves edged in champagne gold.</desc>
  <defs>
    <linearGradient id="leafGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f6a4b"/>
      <stop offset="0.52" stop-color="#0f4c36"/>
      <stop offset="1" stop-color="#073526"/>
    </linearGradient>
    <linearGradient id="leafLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.38" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGold" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#755f2a" flood-opacity="0.2"/>
    </filter>
    <path id="leaf" d="M100 99C82 86 61 71 55 48C50 29 59 14 76 13C87 12 96 18 100 27C104 18 113 12 124 13C141 14 150 29 145 48C139 71 118 86 100 99Z"/>
  </defs>
  <g filter="url(#softGold)" stroke-linejoin="round">
    <g>
      <use href="#leaf" fill="url(#leafGreen)" stroke="#f4dfaa" stroke-width="8"/>
      <use href="#leaf" fill="none" stroke="#ae8a43" stroke-width="3.2"/>
      <use href="#leaf" fill="url(#leafLight)" stroke="none"/>
    </g>
    <g transform="rotate(90 100 100)">
      <use href="#leaf" fill="url(#leafGreen)" stroke="#f4dfaa" stroke-width="8"/>
      <use href="#leaf" fill="none" stroke="#ae8a43" stroke-width="3.2"/>
      <use href="#leaf" fill="url(#leafLight)" stroke="none"/>
    </g>
    <g transform="rotate(180 100 100)">
      <use href="#leaf" fill="url(#leafGreen)" stroke="#f4dfaa" stroke-width="8"/>
      <use href="#leaf" fill="none" stroke="#ae8a43" stroke-width="3.2"/>
      <use href="#leaf" fill="url(#leafLight)" stroke="none"/>
    </g>
    <g transform="rotate(270 100 100)">
      <use href="#leaf" fill="url(#leafGreen)" stroke="#f4dfaa" stroke-width="8"/>
      <use href="#leaf" fill="none" stroke="#ae8a43" stroke-width="3.2"/>
      <use href="#leaf" fill="url(#leafLight)" stroke="none"/>
    </g>
  </g>
  <circle cx="100" cy="100" r="4.4" fill="#0d4934" stroke="#caa75d" stroke-width="2"/>
</svg>
