<style>
:root{--ivory:#f7f4ed;--paper:#fffdf8;--green:#164b39;--muted:#6e786f;--gold:#af8b46;--line:rgba(22,75,57,.2)}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:radial-gradient(circle at 75% 20%,rgba(231,211,161,.5),transparent 24%),linear-gradient(135deg,var(--paper),#e7ece2);color:var(--green);font-family:"DM Sans",Arial,sans-serif;display:grid;place-items:center;padding:24px;overflow:hidden}
.line{position:fixed;border:1px solid rgba(22,75,57,.11);width:min(74vw,900px);aspect-ratio:1;border-radius:47% 53% 65% 35%;transform:rotate(-14deg);pointer-events:none}.line:before,.line:after{content:"";position:absolute;inset:8%;border:inherit;border-radius:inherit}.line:after{inset:17%}
.gate{position:relative;z-index:2;width:min(430px,100%);text-align:center;padding:48px 42px;background:rgba(255,253,248,.78);border:1px solid rgba(255,255,255,.75);box-shadow:0 32px 110px rgba(32,70,51,.11);backdrop-filter:blur(18px)}
.mark{width:92px;margin:0 auto 25px;filter:drop-shadow(0 12px 16px rgba(22,75,57,.12))}h1{font-family:"Italiana",Georgia,serif;font-size:36px;font-weight:400;letter-spacing:.13em;margin:0 0 9px}p{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin:0 0 30px}.field{display:flex;border-bottom:1px solid var(--green);padding:7px 0;gap:10px}input{flex:1;min-width:0;border:0;background:transparent;color:var(--green);outline:0;font:500 18px "DM Sans",sans-serif;letter-spacing:.5em;text-align:center;padding-left:.5em}input::placeholder{color:rgba(22,75,57,.3)}button{border:0;background:none;color:var(--green);font-size:10px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;padding:8px 0}.err{min-height:18px;margin-top:17px;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#9a554c;visibility:hidden}.note{margin-top:18px;font-family:"Italiana",Georgia,serif;font-size:15px;color:var(--gold)}.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@media(max-width:520px){.gate{padding:40px 24px}.mark{width:78px}h1{font-size:30px}.field{display:block}button{margin-top:12px;width:100%}}
@media(prefers-reduced-motion:reduce){.shake{animation:none}}
</style>
</head>

</main>

function bytes(v){const s=atob(v),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
async function unlock(code){
  const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(DATA.s),iterations:600000,hash:'SHA-256'},material,{name:'AES-CBC',length:256},false,['decrypt']);
  const clear=await crypto.subtle.decrypt({name:'AES-CBC',iv:bytes(DATA.i)},key,bytes(DATA.c));
  return new TextDecoder().decode(clear);
}
async function attempt(code,silent=false){
  if(!crypto?.subtle){const e=document.getElementById('err');e.textContent='This preview requires a secure connection';e.style.visibility='visible';return}
  try{
    const html=await unlock(code);sessionStorage.setItem('trefleur_code',code);document.open();document.write(html);document.close();
  }catch(error){
    if(silent)return;const gate=document.getElementById('gate'),e=document.getElementById('err'),pw=document.getElementById('pw');e.textContent='The access code is incorrect';e.style.visibility='visible';pw.value='';gate.classList.remove('shake');void gate.offsetWidth;gate.classList.add('shake');pw.focus();
  }
}
document.getElementById('enter').addEventListener('click',()=>attempt(document.getElementById('pw').value));
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')attempt(e.currentTarget.value)});
const saved=sessionStorage.getItem('trefleur_code');if(saved)attempt(saved,true);
</script>
