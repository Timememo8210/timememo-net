<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>一生，四季 · 四季动效 Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
*{box-sizing:border-box}
:root{
  --paper:#fff4f6; --plum:#5a1e3a;
  --chrome:rgba(255,251,250,.82); --chrome-line:rgba(90,30,58,.16); --chrome-ink:#4a1a33;
  --chrome-on:#5a1e3a; --chrome-on-ink:#ffffff;
  --zh:"Noto Serif SC","Songti SC","STSong","Source Han Serif SC","SimSun",serif;
  --en:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Georgia,serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#1c1220; --chrome:rgba(40,24,42,.84); --chrome-line:rgba(255,220,235,.22);
    --chrome-ink:#ffe6ef; --chrome-on:#ffd3e2; --chrome-on-ink:#3a1228;
  }
}
:root[data-theme="dark"]{
  --paper:#1c1220; --chrome:rgba(40,24,42,.84); --chrome-line:rgba(255,220,235,.22);
  --chrome-ink:#ffe6ef; --chrome-on:#ffd3e2; --chrome-on-ink:#3a1228;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--paper);overflow:hidden;font-family:var(--zh);color:var(--plum);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid #fff;outline-offset:2px;box-shadow:0 0 0 5px var(--plum)}
p,h1,h2{margin:0}

/* ---------- shared ---------- */
.demo{position:fixed;inset:0;display:none;overflow:hidden;color:var(--ink,#5a1e3a)}
.demo.on{display:block}
.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
.brand{position:absolute;left:0;top:0;z-index:8;pointer-events:none;
  padding:calc(14px + env(safe-area-inset-top,0px)) 18px 0;text-shadow:0 1px 14px rgba(255,255,255,.65)}
.brand b{display:block;font-weight:900;font-size:27px;letter-spacing:.08em;line-height:1}
.brand span{display:block;font-family:var(--en);font-weight:500;font-size:11px;letter-spacing:.44em;margin-top:7px}
.snav{position:absolute;right:0;top:0;z-index:9;display:flex;gap:2px;
  padding:calc(10px + env(safe-area-inset-top,0px)) 10px 0}
.snav button{border:0;background:transparent;width:36px;height:36px;border-radius:50%;font-weight:600;font-size:15px;
  color:var(--ink,#5a1e3a);opacity:.6;transition:opacity .4s,background .4s,transform .4s}
.snav button.on{opacity:1;background:rgba(255,255,255,.72);transform:scale(1.08);box-shadow:0 4px 14px rgba(90,30,58,.16)}
.fl,.lo,.pad,.mp,.tu{display:block;width:100%;height:auto;overflow:visible}
.fb{fill:var(--fol,#fff)} .fb.f2{fill:var(--fol2,#ffbfd8)}
.isl{fill:var(--ground,#fff)}
.crown{transform-origin:150px 100px}
.sw{animation:sway 5.5s ease-in-out infinite alternate;transform-origin:50% 100%}
.sw.s2{animation-duration:4.2s;animation-delay:-1.3s} .sw.s3{animation-duration:6.8s;animation-delay:-2.6s}
@keyframes sway{from{transform:rotate(-2.6deg)}to{transform:rotate(2.6deg)}}
.lf{transform-box:fill-box;transform-origin:50% 100%;animation:flut 3.1s ease-in-out infinite alternate;animation-delay:calc(var(--i)*-.41s)}
@keyframes flut{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
.bob{animation:bob 6s ease-in-out infinite alternate}
.bob.b2{animation-duration:7.5s;animation-delay:-2s} .bob.b3{animation-duration:5.2s;animation-delay:-3.4s}
@keyframes bob{from{transform:translate3d(-5px,3px,0) rotate(-1.2deg)}to{transform:translate3d(6px,-4px,0) rotate(1.4deg)}}
.ring{transform:scale(.04) rotate(-55deg);transition:transform 1.5s cubic-bezier(.2,.9,.3,1.08);transition-delay:calc(var(--i)*.16s + .1s)}
.in .ring,.grown .ring{transform:none}
.globe{position:absolute;border-radius:50%;border:1.5px solid rgba(255,255,255,.85);
  background:
    radial-gradient(circle at 29% 22%,rgba(255,255,255,.9) 0,rgba(255,255,255,.3) 9%,rgba(255,255,255,0) 26%),
    radial-gradient(circle at 74% 82%,rgba(255,255,255,.42) 0,rgba(255,255,255,0) 34%),
    radial-gradient(circle at 50% 50%,rgba(255,255,255,0) 56%,rgba(255,255,255,.34) 100%);
  box-shadow:inset 0 0 42px rgba(255,255,255,.7),inset -14px -22px 54px rgba(150,140,255,.28),0 26px 60px -18px rgba(90,30,58,.35)}
.globe i{position:absolute;left:16%;top:11%;width:26%;height:14%;border-radius:50%;background:rgba(255,255,255,.7);
  filter:blur(5px);transform:rotate(-32deg)}

/* ---------- Demo 1 : one scene, four seasons ---------- */
#d1 .stage{position:absolute;inset:0;overflow:hidden}
#d1 .sky{position:absolute;inset:0;background:linear-gradient(180deg,var(--skyTop) 0%,var(--skyBot) 62%)}
#d1 .sun{position:absolute;left:80%;top:16%;width:64vmin;height:64vmin;margin:-32vmin 0 0 -32vmin;border-radius:50%;
  opacity:var(--sunA,1);
  background:radial-gradient(circle,var(--sun) 0 13%,rgba(255,255,255,.6) 14%,rgba(255,255,255,.18) 34%,rgba(255,255,255,0) 64%)}
#d1 .cloud{position:absolute;left:0;height:13vmin;opacity:.85;animation:drift linear infinite;
  background:radial-gradient(ellipse 34% 56% at 30% 64%,#fff 0,rgba(255,255,255,0) 100%),radial-gradient(ellipse 30% 72% at 52% 46%,#fff 0,rgba(255,255,255,0) 100%),radial-gradient(ellipse 34% 50% at 74% 66%,#fff 0,rgba(255,255,255,0) 100%)}
#d1 .c1{top:9%;width:44vmin;animation-duration:80s;animation-delay:-20s}
#d1 .c2{top:21%;width:32vmin;animation-duration:110s;animation-delay:-70s;opacity:.55}
#d1 .c3{top:30%;width:52vmin;animation-duration:140s;animation-delay:-100s;opacity:.5}
@keyframes drift{from{transform:translateX(-45vmin)}to{transform:translateX(110vw)}}
#d1 .bow{position:absolute;left:50%;top:15%;width:150vmin;margin-left:-75vmin;opacity:0;filter:blur(1.5px)}
#d1 .ly{position:absolute;left:-6%;width:112%;will-change:transform}
#d1 .ly>svg{display:block;width:100%;height:100%}
#d1 .far{bottom:44%;height:22%}
#d1 .cps{position:absolute;left:9%;bottom:24%;width:min(72vw,440px)}
#d1 .cps svg{display:block;width:100%;height:auto}
#d1 .mid{bottom:33%;height:17%}
#d1 .trow{position:absolute;inset:0}
#d1 .trow div{position:absolute}
#d1 .trow svg{display:block;width:100%;height:auto}
#d1 .lake{position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(180deg,var(--water2),var(--water) 46%)}
#d1 .lake::after{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,0) 0 9px,rgba(255,255,255,.3) 9px 10.5px);
  -webkit-mask-image:radial-gradient(ellipse at 50% 34%,#000 0,transparent 72%);mask-image:radial-gradient(ellipse at 50% 34%,#000 0,transparent 72%);
  animation:shim 5s linear infinite}
@keyframes shim{to{background-position:0 21px}}
#d1 .way{position:absolute;left:0;bottom:0;width:100%;height:31%}
#d1 .hero{--hw:min(70vw,40vh);position:absolute;left:50%;bottom:28.5%;width:var(--hw);height:var(--hw);margin-left:calc(var(--hw) / -2);will-change:transform}
#d1 .hero .tree{position:absolute;inset:0}
#d1 .hero .tree svg{display:block;width:100%;height:100%;overflow:visible}
#d1 .hero .globe{left:4%;top:0;width:92%;height:92%;will-change:transform,opacity}
#d1 .shore{bottom:-3%;height:25%}
#d1 .flora{position:absolute;inset:0 0 9% 0;pointer-events:none;will-change:transform}
#d1 .grp{position:absolute;inset:0}
#d1 .pl{position:absolute;transform-origin:50% 100%;transform:scale(0);will-change:transform}
#d1 .pl.tr{transform-origin:100% 0}
#d1 .veil{position:absolute;inset:0;background:linear-gradient(180deg,#34477a,#6d85ab);opacity:var(--dim,0);pointer-events:none}
#d1 .scroller{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;z-index:6;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#d1 .scroller::-webkit-scrollbar{display:none}
#d1 .tall{height:640%}
#d1 .copy{position:absolute;left:0;right:0;top:0;z-index:7;pointer-events:none;
  padding:calc(70px + env(safe-area-inset-top,0px)) 20px 0;text-shadow:0 1px 16px rgba(255,255,255,.7)}
.title{font-weight:900;font-size:clamp(42px,13.2vw,96px);line-height:1.08;letter-spacing:.02em;white-space:nowrap}
.title-en{font-family:var(--en);font-weight:500;font-size:clamp(12px,3.3vw,18px);letter-spacing:.5em;margin-top:8px}
#d1 .scs{position:relative;margin-top:18px;will-change:transform}
#d1 .sc{position:absolute;left:0;top:0;opacity:0;will-change:opacity,transform}
.no{font-family:var(--en);font-weight:600;font-size:17px;letter-spacing:.18em}
.sc h2,.card3d h2{font-weight:900;font-size:clamp(27px,7.6vw,46px);letter-spacing:.1em;line-height:1.2;margin-top:2px}
.sen{font-family:var(--en);font-weight:500;font-size:12px;letter-spacing:.56em;margin:6px 0 10px}
.sc .line{font-size:15px;line-height:1.85;max-width:15em}
#d1 .inter{position:absolute;left:0;right:0;top:20%;z-index:7;text-align:center;pointer-events:none;opacity:0;
  font-size:clamp(17px,4.8vw,26px);font-weight:600;letter-spacing:.44em;text-indent:.44em;color:#fff;text-shadow:0 2px 18px rgba(20,30,80,.55)}
#d1 .hint{position:absolute;left:0;right:0;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:7;text-align:center;
  font-size:12px;letter-spacing:.34em;text-indent:.34em;pointer-events:none;text-shadow:0 1px 10px rgba(255,255,255,.8)}
#d1 .hint::after{content:"";display:block;width:1px;height:22px;margin:8px auto 0;background:currentColor;animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:scaleY(.4);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}}
.play{position:absolute;right:12px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:9;border:1px solid rgba(255,255,255,.85);
  background:rgba(255,255,255,.62);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:999px;padding:9px 14px;font-size:13px;font-weight:600;
  color:#5a1e3a;box-shadow:0 8px 22px -8px rgba(90,30,58,.4)}

/* ---------- Demo 2 : long scroll ---------- */
#d2 .bg{position:absolute;inset:0;background:linear-gradient(180deg,var(--skyTop),var(--skyBot))}
#d2 .scroller{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;z-index:2;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#d2 .scroller::-webkit-scrollbar{display:none}
#d2 .long{position:relative;overflow:hidden;isolation:isolate}
#d2 .trail{position:absolute;left:0;top:0;z-index:2;pointer-events:none;overflow:visible}
#d2 .trail path{fill:none;stroke-linecap:round;stroke-linejoin:round}
#d2 .tsh{stroke:rgba(80,30,60,.16)} #d2 .tmain{stroke:#fff7e6} #d2 .tdot{fill:#fff;stroke:#ffb7d0;stroke-width:4;filter:drop-shadow(0 0 8px #fff)}
#d2 .pn{position:relative}
#d2 .px{position:absolute;z-index:3;will-change:transform}
#d2 .px.back{z-index:0}
#d2 .px svg{display:block;width:100%;height:auto;overflow:visible}
#d2 .px.farrow{left:-4%;right:-4%;height:16vh}
#d2 .px.farrow>svg{height:100%}
#d2 .px.farrow .cp{position:absolute;bottom:-1px;width:min(70vw,430px)}
#d2 .px.farrow .tr{position:absolute;bottom:-4px}
#d2 .gnd{position:absolute;left:0;right:0;bottom:0;z-index:1}
#d2 .gnd .wv{position:absolute;left:0;width:100%;height:9vh;display:block}
#d2 .gnd .wv.t{bottom:100%;margin-bottom:-1px}
#d2 .gnd .wv.b{top:100%;margin-top:-1px;transform:scaleY(-1)}
#d2 .gnd .fill{position:absolute;inset:0;background:linear-gradient(180deg,var(--c1),var(--c2))}
#d2 .gnd.water .fill::after{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,0) 0 11px,rgba(255,255,255,.22) 11px 12.5px);animation:shim2 6s linear infinite}
@keyframes shim2{to{background-position:0 25px}}
#d2 .rv{opacity:0;transform:translateY(46px) scale(.72);transition:opacity .9s ease,transform 1.3s cubic-bezier(.2,.9,.25,1.1)}
#d2 .rv.in{opacity:1;transform:none}
#d2 .hero-t{position:relative;z-index:4;padding:calc(88px + env(safe-area-inset-top,0px)) 20px 0;text-shadow:0 1px 16px rgba(255,255,255,.7);color:#5a1e3a}
#d2 .seam{position:relative;height:44vh;display:flex;align-items:center;justify-content:center;z-index:4}
#d2 .seam p{font-size:clamp(18px,5vw,28px);font-weight:900;letter-spacing:.44em;text-indent:.44em;color:var(--ink);text-shadow:0 0 14px #fff,0 0 4px rgba(255,255,255,.9)}
#d2 .tiltwrap{position:absolute;z-index:5;perspective:900px}
.card3d{width:min(76vw,340px);padding:20px 22px 22px;border-radius:26px 26px 26px 6px;color:var(--ci,#5a1e3a);
  background:linear-gradient(145deg,rgba(255,255,255,.82),rgba(255,255,255,.5));
  -webkit-backdrop-filter:blur(12px) saturate(1.3);backdrop-filter:blur(12px) saturate(1.3);
  border:1px solid rgba(255,255,255,.9);box-shadow:0 30px 60px -24px var(--sh,rgba(90,30,58,.5));
  transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transform-style:preserve-3d;will-change:transform}
.card3d h2{transform:translateZ(34px)}
.card3d .no,.card3d .sen{transform:translateZ(18px);display:block}
.card3d .line{font-size:14.5px;line-height:1.85;margin-top:2px}
.card3d .slot{display:inline-block;margin-top:12px;padding:5px 12px;border-radius:999px;font-size:12px;border:1px dashed currentColor;opacity:.75}
#d2 .gal{display:flex;perspective:800px}
#d2 .art{width:min(27vw,150px);aspect-ratio:3/4;border-radius:6px;border:5px solid #fffaf0;box-shadow:0 22px 34px -14px rgba(0,70,90,.6);margin-right:-5%}
#d2 .art:nth-child(1){transform:rotateY(26deg) rotate(-4deg);background:radial-gradient(circle at 28% 28%,#ff7ab8 0,transparent 46%),radial-gradient(circle at 74% 58%,#3fd0ff 0,transparent 52%),radial-gradient(circle at 38% 84%,#ffd84a 0,transparent 46%),#7b5cff}
#d2 .art:nth-child(2){transform:translateY(-14%) translateZ(30px);background:radial-gradient(circle at 70% 24%,#ffe14a 0,transparent 44%),radial-gradient(circle at 24% 62%,#ff5a8a 0,transparent 50%),radial-gradient(circle at 78% 82%,#35e0b0 0,transparent 46%),#ff9a3c}
#d2 .art:nth-child(3){transform:rotateY(-26deg) rotate(5deg);background:radial-gradient(circle at 34% 72%,#5b8cff 0,transparent 50%),radial-gradient(circle at 68% 30%,#ff8ad0 0,transparent 48%),radial-gradient(circle at 20% 18%,#fff3a0 0,transparent 40%),#22c7c0}
#d2 .foot{position:absolute;left:0;right:0;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:5;text-align:center;font-size:12px;letter-spacing:.2em;color:#fff;text-shadow:0 1px 10px rgba(120,30,0,.5)}
#d2 .rip{position:absolute;border:1.5px solid rgba(255,255,255,.8);border-radius:50%;width:22vmin;height:6vmin;opacity:0;animation:rip 2.8s ease-out infinite}
@keyframes rip{0%{transform:scale(.15);opacity:.9}100%{transform:scale(1.5);opacity:0}}

/* ---------- Demo 3 : 3D globe ---------- */
#d3 .bg{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 38%,var(--skyBot),var(--skyTop))}
#d3 .gl{position:absolute;inset:0;touch-action:none;cursor:grab;z-index:2}
#d3 .gl:active{cursor:grabbing}
#d3 .gl canvas{display:block;width:100%;height:100%}
#d3 .lab{position:absolute;left:0;right:0;top:calc(78px + env(safe-area-inset-top,0px));z-index:7;text-align:center;pointer-events:none;text-shadow:0 1px 16px rgba(255,255,255,.7)}
#d3 .lab h2{font-weight:900;font-size:clamp(30px,8.6vw,54px);letter-spacing:.12em;text-indent:.12em}
#d3 .lab .sen{letter-spacing:.6em;text-indent:.6em}
#d3 .inter{position:absolute;left:0;right:0;top:calc(98px + env(safe-area-inset-top,0px));z-index:7;text-align:center;pointer-events:none;opacity:0;
  font-size:clamp(17px,4.8vw,26px);font-weight:600;letter-spacing:.44em;text-indent:.44em;color:#fff;text-shadow:0 2px 18px rgba(20,30,80,.55)}
#d3 .tip{position:absolute;left:0;right:0;bottom:calc(122px + env(safe-area-inset-bottom,0px));z-index:7;text-align:center;font-size:12px;letter-spacing:.3em;text-indent:.3em;pointer-events:none;opacity:.8}
#d3 .pills{position:absolute;left:0;right:0;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:9;display:flex;justify-content:center;gap:8px}
#d3 .pills button{border:1px solid rgba(255,255,255,.85);background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-radius:999px;min-width:44px;height:40px;padding:0 14px;font-weight:600;font-size:15px;color:#5a1e3a;transition:background .3s,color .3s,transform .3s}
#d3 .pills button.on{background:#5a1e3a;color:#fff;border-color:#5a1e3a;transform:translateY(-2px)}
#d3 .nogl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:30px;text-align:center}

/* ---------- dock ---------- */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;pointer-events:none;
  padding:0 10px calc(10px + env(safe-area-inset-bottom,0px))}
#dock div{pointer-events:auto;display:flex;gap:3px;padding:5px;border-radius:999px;background:var(--chrome);border:1px solid var(--chrome-line);
  -webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);box-shadow:0 10px 30px -8px rgba(60,20,40,.35)}
#dock button{border:0;background:transparent;color:var(--chrome-ink);font-weight:600;font-size:13px;line-height:1;padding:11px 13px;border-radius:999px;white-space:nowrap;transition:background .3s,color .3s}
#dock button[aria-selected="true"]{background:var(--chrome-on);color:var(--chrome-on-ink)}

@media (min-width:760px){
  .brand b{font-size:32px}
  #d1 .copy{padding-left:44px} .brand{padding-left:44px} #d2 .hero-t{padding-left:44px}
  #d1 .sc .line{font-size:17px}
}
@media (max-height:700px){
  #d1 .hero{--hw:min(62vw,35vh)}
  #d1 .copy{padding-top:calc(62px + env(safe-area-inset-top,0px))}
  #d1 .scs{margin-top:10px}
  .sc .line{font-size:14px;line-height:1.7}
}
@media (prefers-reduced-motion:reduce){
  .sw,.lf,.bob,#d1 .cloud,#d1 .lake::after,#d2 .gnd.water .fill::after,#d2 .rip,#d1 .hint::after{animation:none}
  #d2 .rv,.ring{transition:none}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <linearGradient id="gPeo0" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff4f86"/><stop offset="1" stop-color="#ffd9e6"/></linearGradient>
  <linearGradient id="gPeo1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#f02d6d"/><stop offset="1" stop-color="#ffa9c6"/></linearGradient>
  <linearGradient id="gPeo2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#c4124b"/><stop offset="1" stop-color="#ff7aa6"/></linearGradient>
  <linearGradient id="gWht" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffe89a"/><stop offset=".4" stop-color="#ffffff"/><stop offset="1" stop-color="#fff5f8"/></linearGradient>
  <linearGradient id="gPlum" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff5f9c"/><stop offset="1" stop-color="#ffe3ee"/></linearGradient>
  <linearGradient id="gLotus" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fff8fb"/><stop offset=".5" stop-color="#ffc6de"/><stop offset="1" stop-color="#ff3d8d"/></linearGradient>
  <radialGradient id="gPad" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#96f2ac"/><stop offset=".6" stop-color="#25b869"/><stop offset="1" stop-color="#0b8a52"/></radialGradient>

    lab.style.opacity=bump(pm,idx,.4).toFixed(3);
    let best=INTER[0];for(const it of INTER)if(Math.abs(pm-it[0])<Math.abs(pm-best[0]))best=it;
    if(inter.textContent!==best[1])inter.textContent=best[1];inter.style.opacity=bump(pm,best[0],.22).toFixed(3);
    fx.w=w;fx.wind=windOf(pm);fx.step(dt,t);
    if(!ok)return;
    col(M.ground.color,c.ground);col(M.water.color,c.water);col(M.fol.color,c.fol);col(M.fol2.color,c.fol2);
    col(objs.hemi.color,c.skyBot);col(objs.hemi.groundColor,c.ground);col(objs.sun.color,c.sun);
    objs.sun.intensity=.45+.5*c.sunA;objs.hemi.intensity=.86-c.dim*.6;
    const gW=bump(pm,0,.7),gSp=bump(pm,1,.75),gSu=bump(pm,2,.7),gAu=bump(pm,3,.75);
    M.roof.color.setRGB(lerp(.85,1,gW),lerp(.28,1,gW),lerp(.43,1,gW));
    objs.fol.forEach(o=>o.scale.setScalar(c.leafK));
    const bk=clamp(gSp+.7*gW);for(const b of objs.bl){const r=b.c[3]*c.leafK;b.o.position.set(b.c[0]+b.d[0]*r,b.c[1]+b.d[1]*r,b.c[2]+b.d[2]*r);b.o.scale.setScalar(Math.max(bk,.0001));b.o.visible=bk>.01}
    K(objs.fl,clamp(gSp*1.15+gSu*.6));K(objs.lo,gSu);K(objs.lv,gAu);K(objs.sn,gW);
    // particles
    const tot=w.snow+w.rain+w.petal+w.glow+w.leaf+1e-4,n=1/tot;
    const vy=(w.snow*.55+w.rain*6+w.petal*.6-w.glow*.25+w.leaf*.9)*n,sz=(w.snow*.13+w.rain*.06+w.petal*.13+w.glow*.13+w.leaf*.17)*n;
    M.pts.size=sz;M.pts.opacity=clamp(tot*1.4);
    M.pts.color.setRGB((w.snow+w.rain*.82+w.petal+w.glow+w.leaf)*n,(w.snow+w.rain*.92+w.petal*.6+w.glow*.95+w.leaf*.5)*n,(w.snow+w.rain+w.petal*.76+w.glow*.5+w.leaf*.14)*n);
    for(let i=0;i<ptsVel.length;i++){const j=i*3;ptsPos[j+1]-=vy*ptsVel[i]*dt;ptsPos[j]+=Math.sin(t*.8+i)*.12*dt;
      const dx=ptsPos[j],dy=ptsPos[j+1]-.75,dz=ptsPos[j+2],out=dx*dx+dy*dy+dz*dz>10.6;
      if(out||(dy<-.75&&dx*dx+dz*dz<6.2)){const a=Math.random()*6.283,r=Math.sqrt(Math.random())*3;ptsPos[j]=Math.cos(a)*r;ptsPos[j+2]=Math.sin(a)*r;const hh=Math.sqrt(Math.max(0,10.2-r*r));ptsPos[j+1]=.75+(vy>=0?hh:-.7+Math.random()*.5)}}
    pts.geometry.attributes.position.needsUpdate=true;
    if(!drag){idle+=dt;if(!REDUCED)rotY+=dt*.16}
    world.rotation.y=rotY;world.rotation.x=rotX+Math.sin(t*.5)*.015;world.position.y=Math.sin(t*.8)*.05;
    ren.render(scene,cam);
  }
  return{build,resize,frame,built:false,jump(v){p=target=v;autoplay=false;syncPills()}};
})();

/* ================= shell ================= */
const DEMOS={d1:D1,d2:D2,d3:D3};let cur=null,curId='';
function show(id){
  curId=id;cur=DEMOS[id];
  $$('.demo').forEach(s=>s.classList.toggle('on',s.id===id));
  $$('#dock button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===id));
  if(!cur.built){cur.build();cur.built=true}
  cur.resize();
}
$$('#dock button').forEach(b=>b.addEventListener('click',()=>show(b.dataset.t)));
let rz=0;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>cur&&cur.resize(),120)});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>cur&&cur.resize());
let last=performance.now();
function tick(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  ptr.x+=(ptr.tx-ptr.x)*.08;ptr.y+=(ptr.ty-ptr.y)*.08;
  if(cur&&!document.hidden)cur.frame(dt,now/1000);
  requestAnimationFrame(tick);
}
show('d1');requestAnimationFrame(tick);
window.__demo={show,jump3:v=>D3.jump(v)};
})();
