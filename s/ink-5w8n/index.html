<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>一生四季 · 水墨动效 Demo</title>
<script>(function(){var l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600&display=swap';document.head.appendChild(l)})()</script>
<link rel="preload" href="brush.woff2" as="font" type="font/woff2" crossorigin>
<style>@font-face{font-family:"InkBrush";src:url(brush.woff2) format("woff2");font-display:swap}</style>
<style>
*{box-sizing:border-box}
:root{
  --paper:#f3eee2; --ink:#232326; --red:#b5302a;
  --chrome:rgba(246,241,230,.86); --chrome-line:rgba(35,35,38,.22); --chrome-ink:#2b2b2e;
  --chrome-on:#232326; --chrome-on-ink:#f3eee2;
  --brush:"InkBrush","Ma Shan Zheng","STKaiti","Kaiti SC","KaiTi","Noto Serif SC","Songti SC",serif;
  --zh:"Noto Serif SC","Songti SC","STSong","Source Han Serif SC","SimSun",serif;
  --en:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Georgia,serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --chrome:rgba(34,34,36,.88); --chrome-line:rgba(243,238,226,.26); --chrome-ink:#ece6d8;
    --chrome-on:#ece6d8; --chrome-on-ink:#232326;
  }
}
:root[data-theme="dark"]{
  --chrome:rgba(34,34,36,.88); --chrome-line:rgba(243,238,226,.26); --chrome-ink:#ece6d8;
  --chrome-on:#ece6d8; --chrome-on-ink:#232326;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--paper);overflow:hidden;font-family:var(--zh);color:var(--ink);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--red);outline-offset:3px}
p,h1,h2{margin:0}

.demo{position:fixed;inset:0;display:none;overflow:hidden;background:var(--paper)}
.demo.on{display:block}
.gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.gl.nogl{background:linear-gradient(180deg,#b9c3c9,#ece8dc 55%,#cfd8d2)}
.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
.brand{position:absolute;left:0;top:0;z-index:8;pointer-events:none;display:flex;align-items:center;gap:10px;
  padding:calc(14px + env(safe-area-inset-top,0px)) 16px 0}
.seal{display:inline-block;writing-mode:vertical-rl;max-height:calc(2.3em + 10px);font-family:var(--brush);font-size:17px;line-height:1.12;
  color:#fbf3e6;background:var(--red);padding:5px 4px 4px;border-radius:5px 4px 6px 4px;transform:rotate(-2deg);
  box-shadow:inset 0 0 0 1.5px rgba(251,243,230,.5),0 0 0 .5px var(--red)}
.brand .bn{font-family:var(--en);font-weight:500;font-size:11.5px;letter-spacing:.42em;color:var(--ink);opacity:.8}
.inkin{opacity:0;filter:blur(10px);transition:opacity 1.3s ease,filter 1.5s ease}
.inkin.in{opacity:1;filter:blur(0)}

/* ---------- Demo 1 : 行舟 (handscroll journey) ---------- */
#d1 .fgs{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}
#d1 .fg{position:absolute;left:0;will-change:transform}
#d1 .fg canvas{display:block}
#d1 .fg.sway canvas{animation:sway 6s ease-in-out infinite alternate;transform-origin:50% 0}
@keyframes sway{from{transform:rotate(-1.4deg)}to{transform:rotate(1.4deg)}}
#d1 .boat{position:absolute;left:34%;bottom:13.5%;z-index:4;animation:rock 4.6s ease-in-out infinite alternate;transform-origin:50% 80%}
@keyframes rock{from{transform:rotate(-1.8deg) translateY(1px)}to{transform:rotate(1.5deg) translateY(-2px)}}
#d1 .scroller{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;z-index:6;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#d1 .scroller::-webkit-scrollbar{display:none}
#d1 .tall{height:800%}
#d1 .ttl{position:absolute;left:9vw;top:calc(84px + env(safe-area-inset-top,0px));z-index:7;pointer-events:none;writing-mode:vertical-rl;
  font-family:var(--brush);font-size:clamp(64px,19vw,132px);line-height:1.08;color:var(--ink);will-change:opacity,transform}
#d1 .ttl span{font-family:var(--en);font-style:italic;font-size:15px;letter-spacing:.14em;margin-right:14px;opacity:.75}
.poem{writing-mode:vertical-rl;color:var(--ink)}
.poem .hd{font-size:13px;letter-spacing:.5em;margin-left:16px;opacity:.85}
.poem .hd b{font-family:var(--brush);font-weight:400;font-size:26px;letter-spacing:0;color:var(--red);margin-bottom:.35em}
.poem .l{font-family:var(--brush);font-size:clamp(25px,7vw,42px);letter-spacing:.2em;line-height:1.5}
.poem .by{font-size:11.5px;letter-spacing:.36em;margin-right:12px;opacity:.7;padding-top:5.5em}
#d1 .poem{position:absolute;right:7vw;top:calc(66px + env(safe-area-inset-top,0px));z-index:7;pointer-events:none;opacity:0;will-change:opacity,transform}
#d1 .inter,#d3 .inter{position:absolute;left:0;right:0;z-index:7;text-align:center;pointer-events:none;opacity:0;
  font-family:var(--brush);font-size:clamp(22px,6vw,34px);letter-spacing:.5em;text-indent:.5em;color:var(--ink)}
#d1 .inter{top:31%}
#d1 .hint{position:absolute;left:0;right:0;bottom:calc(112px + env(safe-area-inset-bottom,0px));z-index:7;text-align:center;
  font-size:12px;letter-spacing:.4em;text-indent:.4em;pointer-events:none;opacity:.8}
.snav{position:absolute;left:10px;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:9;display:flex;gap:0}
.snav button{border:0;background:transparent;width:38px;height:40px;font-family:var(--brush);font-size:20px;color:var(--ink);opacity:.45;position:relative;transition:opacity .4s}
.snav button.on{opacity:1}
.snav button.on::after{content:"";position:absolute;left:50%;bottom:3px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--red)}
.play{position:absolute;right:12px;bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:9;border:1px solid rgba(35,35,38,.55);
  background:rgba(243,238,226,.7);border-radius:3px;padding:8px 13px;font-size:13px;letter-spacing:.14em;color:var(--ink)}

/* ---------- Demo 2 : 四君子 (hanging scroll / site) ---------- */
#d2 .bg{position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 0%,var(--w1,#dfe3e6),transparent 70%),linear-gradient(180deg,var(--w2,#eceae4),var(--paper))}
#d2 .grain{position:absolute;inset:0;opacity:.5;mix-blend-mode:multiply;pointer-events:none;z-index:5}
#d2 .scroller{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;z-index:2;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#d2 .scroller::-webkit-scrollbar{display:none}
#d2 .long{position:relative;overflow:hidden}
#d2 .hero{position:relative;height:100vh;min-height:560px}
#d2 .hero .gl{-webkit-mask-image:linear-gradient(#000 72%,transparent);mask-image:linear-gradient(#000 72%,transparent)}
#d2 .hero .ttl{position:absolute;right:13vw;top:calc(92px + env(safe-area-inset-top,0px));writing-mode:vertical-rl;font-family:var(--brush);
  font-size:clamp(70px,21vw,150px);line-height:1.06}
#d2 .hero .sub{position:absolute;left:9vw;top:calc(104px + env(safe-area-inset-top,0px));writing-mode:vertical-rl;font-size:14px;letter-spacing:.6em;line-height:2.1;opacity:.85}
#d2 .hero .sub i{font-family:var(--en);font-size:15px;letter-spacing:.16em}
#d2 .hero .hint{position:absolute;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom,0px));text-align:center;font-size:12px;letter-spacing:.4em;text-indent:.4em;opacity:.75}
#d2 .ch{position:relative;padding:7vh 0 16vh}
#d2 .paint{position:relative;display:flex;margin-top:15vh}
#d2 .paint canvas{display:block;-webkit-mask-image:linear-gradient(#000 80%,transparent 99%);mask-image:linear-gradient(#000 80%,transparent 99%)}
#d2 .ch.vl .paint{justify-content:flex-end;margin-right:-2vw}
#d2 .ch.vr .paint{justify-content:flex-start;margin-left:-5vw}
#d2 .vt{position:absolute;top:7vh;z-index:2;writing-mode:vertical-rl;display:flex;align-items:center;gap:12px}
#d2 .ch.vr .vt{right:8vw}
#d2 .ch.vl .vt{left:8vw}
#d2 .vt .big{font-family:var(--brush);font-size:clamp(84px,25vw,170px);line-height:1;color:var(--ink)}
#d2 .vt .vs{font-size:15px;letter-spacing:.7em;line-height:1.9;padding-top:.3em}
#d2 .vt .vs b{font-family:var(--brush);font-weight:400;font-size:27px;letter-spacing:.3em}
#d2 .vt .num{font-family:var(--brush);font-size:16px;color:#fbf3e6;background:var(--red);padding:6px 4px;border-radius:4px;margin-top:.4em}
#d2 .note{position:relative;margin:4vh 9vw 0;max-width:23em;padding:4px 0 4px 20px;border-left:1.5px solid rgba(35,35,38,.75)}
#d2 .ch.vr .note{margin-left:auto}
#d2 .note h2{font-family:var(--brush);font-weight:400;font-size:clamp(36px,10vw,56px);letter-spacing:.24em;line-height:1.2}
#d2 .note .lead{font-family:var(--brush);font-size:21px;letter-spacing:.14em;margin:8px 0 12px;color:var(--red)}
#d2 .note p.body{font-size:15px;line-height:2;letter-spacing:.04em}
#d2 .note .slot{display:inline-block;margin-top:14px;font-size:12px;letter-spacing:.3em;padding:6px 12px;border:1px dashed rgba(35,35,38,.6)}
#d2 .end{position:relative;height:62vh;text-align:center;padding-top:10vh}
#d2 .end canvas{position:absolute;left:0;bottom:0}
#d2 .hero .ttl,#d2 .hero .sub,#d2 .hero .hint{z-index:2}
#d2 .end p{position:relative;font-family:var(--brush);font-size:clamp(26px,7vw,40px);letter-spacing:.4em;text-indent:.4em}
#d2 .end small{position:relative;display:block;margin-top:14px;font-size:12px;letter-spacing:.3em;opacity:.7}
#d2 .snav{left:auto;right:8px;bottom:auto;top:calc(8px + env(safe-area-inset-top,0px))}

/* ---------- Demo 3 : 观山 (enso window) ---------- */
#d3 .wall{position:absolute;inset:0;background:radial-gradient(circle at 50% 47%,var(--wash,#c9d2da) 0,rgba(243,238,226,0) 62%),var(--paper)}
#d3 .grain{position:absolute;inset:0;opacity:.45;mix-blend-mode:multiply;pointer-events:none}
#d3 .moon{--D:min(86vw,52vh);position:absolute;left:50%;top:47%;width:var(--D);height:var(--D);margin:calc(var(--D) / -2) 0 0 calc(var(--D) / -2);
  border-radius:50%;overflow:hidden;z-index:2;cursor:pointer;touch-action:none;box-shadow:0 18px 50px -20px rgba(30,30,40,.5)}
#d3 .enso{position:absolute;left:50%;top:47%;z-index:3;pointer-events:none}
#d3 .bigch{position:absolute;left:8vw;top:calc(58px + env(safe-area-inset-top,0px));z-index:5;font-family:var(--brush);font-size:clamp(84px,27vw,190px);line-height:1;pointer-events:none}
#d3 .sub3{position:absolute;left:calc(8vw + clamp(92px,29vw,204px));top:calc(84px + env(safe-area-inset-top,0px));z-index:5;writing-mode:vertical-rl;font-size:14px;letter-spacing:.6em;line-height:2;pointer-events:none}
#d3 .sub3 i{font-family:var(--en);font-size:14px;letter-spacing:.2em;opacity:.75}
#d3 .poem3{position:absolute;left:0;right:0;top:calc(47% + min(43vw,26vh) + 26px);z-index:5;text-align:center;pointer-events:none}
#d3 .poem3 .l{font-family:var(--brush);font-size:clamp(21px,5.8vw,30px);letter-spacing:.24em;text-indent:.24em;line-height:1.6}
#d3 .poem3 .by{font-size:11.5px;letter-spacing:.34em;opacity:.7;margin-top:6px}
#d3 .inter{top:calc(47% - 18px);color:#fff;text-shadow:0 1px 14px rgba(20,24,34,.8);z-index:5}
#d3 .pills{position:absolute;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:9;display:flex;justify-content:center;gap:10px}
#d3 .pills button{width:42px;height:42px;border-radius:50%;border:1px solid rgba(35,35,38,.6);background:rgba(243,238,226,.6);font-family:var(--brush);font-size:20px;color:var(--ink);transition:background .4s,color .4s,border-color .4s}
#d3 .pills button.on{background:var(--red);border-color:var(--red);color:#fbf3e6}
#d3 .pills button.auto{width:auto;padding:0 14px;border-radius:21px;font-family:var(--zh);font-size:13px;letter-spacing:.2em}
#d3 .pills button.auto.on{background:var(--ink);border-color:var(--ink)}
.swap{transition:opacity .9s ease,filter 1s ease}
.swap.out{opacity:0;filter:blur(14px)}
@media (min-aspect-ratio:1/1){
  #d3 .moon{--D:min(60vh,44vw)}
  #d3 .bigch{left:9vw;top:24%}
  #d3 .sub3{left:calc(9vw + clamp(92px,29vw,204px));top:28%}
  #d3 .poem3{left:auto;right:9vw;top:22%;writing-mode:vertical-rl;text-align:left}
  #d3 .poem3 .l{letter-spacing:.28em;text-indent:0}
  #d3 .poem3 .by{margin:0 12px 0 0;padding-top:6em}
}

/* ---------- dock ---------- */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;pointer-events:none;
  padding:0 10px calc(10px + env(safe-area-inset-bottom,0px))}
#dock div{pointer-events:auto;display:flex;gap:2px;padding:4px;border-radius:4px;background:var(--chrome);border:1px solid var(--chrome-line);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
#dock button{border:0;background:transparent;color:var(--chrome-ink);font-size:13.5px;letter-spacing:.24em;text-indent:.24em;line-height:1;padding:11px 15px;border-radius:2px;white-space:nowrap;transition:background .3s,color .3s}
#dock button[aria-selected="true"]{background:var(--chrome-on);color:var(--chrome-on-ink)}

@media (min-width:760px){
  #d1 .ttl{left:8vw;font-size:clamp(90px,10vw,150px)} #d1 .poem{right:8vw}
  #d2 .note p.body{font-size:16.5px}
}
@media (prefers-reduced-motion:reduce){
  #d1 .fg.sway canvas,#d1 .boat{animation:none}
  .inkin,.swap{transition:none}
}
</style>
</head>
<body>
<section id="d1" class="demo on" aria-label="行舟：横卷四季"></section>
<section id="d2" class="demo" aria-label="四君子：立轴"></section>
<section id="d3" class="demo" aria-label="观山：圆相之窗"></section>
<nav id="dock" aria-label="切换 Demo"><div role="tablist">
  <button role="tab" aria-selected="true" data-t="d1">行舟</button>
  <button role="tab" aria-selected="false" data-t="d2">四君子</button>
  <button role="tab" aria-selected="false" data-t="d3">观山</button>
</div></nav>

<script>
(()=>{'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x, lerp=(a,b,t)=>a+(b-a)*t;
const sm=x=>{x=clamp(x);return x*x*(3-2*x)};
const bump=(p,c,w)=>{let d=Math.abs(p-c)%4;if(d>2)d=4-d;return sm(1-d/w)};
const REDUCED=matchMedia('(prefers-reduced-motion:reduce)').matches;
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const h2=(x,y)=>{const n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n)};
function vn(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  return lerp(lerp(h2(xi,yi),h2(xi+1,yi),u),lerp(h2(xi,yi+1),h2(xi+1,yi+1),u),v)}
const fb=(x,y)=>(vn(x,y)*.5+vn(x*2.03+17,y*2.03+9)*.25+vn(x*4.1+31,y*4.1+5)*.125+vn(x*8.2+3,y*8.2+47)*.0625)/.9375;
const escH=t=>t.replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const QS=new URLSearchParams(location.search);
const NAME=escH((QS.get('n')||'四季').slice(0,4)),NAME_EN=escH((QS.get('en')||'FOUR SEASONS').slice(0,28).toUpperCase());

/* ================= content ================= */
const SEASONS=[
  {zh:'冬',sub:'初始',en:'Winter',num:'壹',poem:['墙角数枝梅','凌寒独自开'],by:'王安石《梅花》'},
  {zh:'春',sub:'生长',en:'Spring',num:'贰',poem:['随风潜入夜','润物细无声'],by:'杜甫《春夜喜雨》'},
  {zh:'夏',sub:'盛放',en:'Summer',num:'叁',poem:['接天莲叶无穷碧','映日荷花别样红'],by:'杨万里《晓出净慈寺送林子方》'},
  {zh:'秋',sub:'收获',en:'Autumn',num:'肆',poem:['停车坐爱枫林晚','霜叶红于二月花'],by:'杜牧《山行》'}];
const GENTS=[
  {plant:'梅',virt:'傲',lead:'凌寒而开，是最初的样子',body:'故事从一个安静的冬天开始。这里放一段自我介绍，和一张最早的照片。',slot:'照片位'},
  {plant:'兰',virt:'幽',lead:'不争不抢，自有清香',body:'读书、远行、遇见的人。这里写求学与成长的经历。',slot:'时间线位'},
  {plant:'竹',virt:'坚',lead:'一节一节，向上生长',body:'最用力发光的那些年。这里陈列作品，和最骄傲的时刻。',slot:'作品位'},
  {plant:'菊',virt:'淡',lead:'繁华落尽，从容自在',body:'家人、朋友，和一路攒下的果实。这里放合影与感谢。',slot:'合影位'}];
const INTER=[[.5,'雪化成雨'],[1.5,'一阵太阳雨'],[2.5,'起风了'],[3.5,'初霜']];
const wts=p=>({snow:bump(p,0,.55),rain:Math.max(bump(p,.5,.34),.7*bump(p,1.5,.2)),petal:bump(p,1,.5),glow:bump(p,2,.55),leaf:bump(p,3,.62)});
const windOf=p=>24+150*bump(p,2.55,.3)+36*bump(p,3,.6);
const brandHTML=`<div class="brand"><span class="seal">${NAME}</span><span class="bn">${NAME_EN}</span></div>`;
const snavHTML=`<div class="snav" role="group" aria-label="季节">${SEASONS.map((s,i)=>`<button data-i="${i}" aria-label="${s.zh}天">${s.zh}</button>`).join('')}</div>`;
const poemHTML=(s,cls='poem')=>`<div class="${cls}"><p class="hd"><b>${s.zh}</b>${s.sub}</p>${s.poem.map(l=>`<p class="l">${l}</p>`).join('')}<p class="by">${s.by}</p></div>`;

/* ================= ink landscape shader ================= */
const V=h=>{const c=hex(h);return `vec3(${(c[0]/255).toFixed(3)},${(c[1]/255).toFixed(3)},${(c[2]/255).toFixed(3)})`};
const P4=(a,b,c,d)=>`pal(${V(a)},${V(b)},${V(c)},${V(d)},sp)`;
const FRAG=`precision highp float;
uniform vec2 uRes,uPar,uSun,uDrop;uniform float uT,uCam,uSeason,uSpread,uBleed,uMix,uTh,uZoom,uWater;
float hash(vec2 p){p=mod(p,289.);return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x),f.y);}
float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*noise(p);p=p*2.03+vec2(17.3,9.1);a*=.5;}return s/.9375;}
float ridge(float x,float sd){
  float w=x+.4*(noise(vec2(x*.7,sd+11.))-.5);
  float n=fbm(vec2(w,sd));
  float c=1.-abs(2.*noise(vec2(w*2.6+3.,sd+7.))-1.);
  return smoothstep(.22,.86,n)*.7+c*c*.2+noise(vec2(w*7.,sd+2.))*.1;}
float dabs(vec2 p){vec2 i=floor(p),f=fract(p);float h=hash(i+.5);vec2 c=vec2(hash(i+3.1),hash(i+7.7))*.5+.25;float r=.14+.24*hash(i+1.7);

    if(els.inter.textContent!==best[1])els.inter.textContent=best[1];const ia=bump(p,best[0],.17);els.inter.style.opacity=ia.toFixed(3);els.inter.style.filter=`blur(${((1-ia)*8).toFixed(1)}px)`;

    els.hint.style.opacity=(.8*(1-sm((p-PMIN)/.2))).toFixed(3);
    fx.w=wts(Math.max(p,0));fx.wind=windOf(p);fx.step(dt,t);
    // birds
    const g=fx.g,ba=.25+.6*Math.max(bump(p,3,.8),bump(p,1,.7)),bx=W-((t*22+W*.3)%(W+260))+60,by=H*.2+Math.sin(t*.3)*H*.03;
    g.strokeStyle='#1e1e22';g.lineCap='round';g.lineWidth=1.5;g.globalAlpha=ba;
    for(const b of birds){const x=bx+b.dx,y=by+b.dy,fl=Math.sin(t*5+b.ph)*3.4,s=7;g.beginPath();g.moveTo(x-s,y-fl);g.quadraticCurveTo(x-s*.4,y-1.5-fl*.3,x,y+1);g.quadraticCurveTo(x+s*.4,y-1.5-fl*.3,x+s,y-fl);g.stroke()}
    g.globalAlpha=1;
  }
  return{build,resize,frame,built:false,setP(v){const max=sc.scrollHeight-sc.clientHeight;sc.scrollTop=max*(v-PMIN)/(PMAX-PMIN)}};
})();

/* ================= DEMO 2 : 四君子 ================= */
const D2=(()=>{
  const el=$('#d2');let sc,long,fx,gl,chs=[],nav,anchors=[],lastP=-9,lastW=-1;
  const GEN=[plum,orchid,bamboo,mum];
  const WASH=[[hex('#cfd6dc'),hex('#e9e9e5')],[hex('#dbe9dc'),hex('#f1efe2')],[hex('#cfe4e0'),hex('#eef0e2')],[hex('#f0d9b4'),hex('#f7eeda')]];
  function build(){
    el.innerHTML=`<div class="bg"></div>
    <div class="scroller" tabindex="0"><div class="long">
      <header class="hero"><canvas class="gl"></canvas>
        <h1 class="ttl inkin in"><p>一生</p><p>四季</p></h1>
        <p class="sub">梅兰竹菊 四时为序　<i>A life in four seasons</i></p>
        <p class="hint">向上滑动 展卷</p></header>
      ${SEASONS.map((s,i)=>`<article class="ch ${i<2?'vl':'vr'}" data-i="${i}">
        <div class="vt inkin"><span class="big">${s.zh}</span><span class="vs"><b>${GENTS[i].plant}</b>　${GENTS[i].virt}</span><span class="num">${s.num}</span></div>
        <div class="paint"><canvas></canvas></div>
        <div class="note inkin"><h2>${s.sub}</h2><p class="lead">${GENTS[i].lead}</p><p class="body">${GENTS[i].body}</p><span class="slot">${GENTS[i].slot}</span></div>
      </article>`).join('')}
      <footer class="end"><canvas class="mt"></canvas><p class="inkin">四时有序 万物有时</p><small>视觉概念稿　文字与图片均为占位</small></footer>
    </div></div>
    <div class="grain"></div><canvas class="fx"></canvas>${brandHTML}${snavHTML}`;
    sc=$('.scroller',el);long=$('.long',el);fx=new Weather($('.fx',el),{density:.55});gl=new InkGL($('.hero .gl',el));
    $('.grain',el).style.backgroundImage=`url(${GRAIN})`;
    nav=$$('.snav button',el);
    nav.forEach(b=>b.addEventListener('click',()=>{const c=chs[+b.dataset.i].e;sc.scrollTo({top:c.offsetTop-10,behavior:REDUCED?'auto':'smooth'})}));
    chs=$$('.ch',el).map((e,i)=>({e,i,cv:$('canvas',e),S:null,k:0,t:-1,drawn:0}));
    const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{root:sc,threshold:.2});
    $$('.inkin:not(.in)',el).forEach(e=>io.observe(e));
    const io2=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){const c=chs.find(c=>c.cv===x.target);if(c&&c.t<0)c.t=0;io2.unobserve(x.target)}}),{root:sc,threshold:.25});
    chs.forEach(c=>io2.observe(c.cv));
  }
  function resize(){
    fx.resize();gl.resize();const W=el.clientWidth,H=el.clientHeight;
    if(Math.abs(W-lastW)>4){lastW=W;
      chs.forEach(c=>{const w=Math.min(W*.9,560),h=Math.min(w*1.32,H*.92),d=Math.min(devicePixelRatio||1,2);
        c.cv.width=w*d;c.cv.height=h*d;c.cv.style.width=w+'px';c.cv.style.height=h+'px';c.g=c.cv.getContext('2d');c.g.setTransform(d,0,0,d,0,0);
        seed=300+c.i*31;c.S=[];GEN[c.i](c.S,w,h);c.drawn=0;if(c.t>=0){c.t=Math.max(c.t,0)}});
      [['.end .mt',1,[{c:'196,150,104',f:1.3,s:33,y:.42,amp:.34,len:.5,a:.42},{c:'150,84,52',f:1,s:41,y:.66,amp:.34,len:.4,a:.6,edge:.3},{c:'96,44,30',f:.8,s:52,y:.9,amp:.26,len:.3,a:.8,edge:.5}]]].forEach(([q,hf,layers])=>{
        const cv=$(q,el),hh=cv.parentElement.clientHeight*hf,d=Math.min(devicePixelRatio||1,2);cv.width=W*d;cv.height=hh*d;cv.style.width=W+'px';cv.style.height=hh+'px';
        const g=cv.getContext('2d');g.setTransform(d,0,0,d,0,0);washMt(g,W,hh,layers)});
    }
    anchors=chs.map(c=>[c.e.offsetTop+c.e.offsetHeight*.4,c.i]);lastP=-9;
  }
  function frame(dt,t,ms){
    const st=sc.scrollTop,vh=sc.clientHeight,ref=st+vh*.5;let p=0;
    if(st<vh){const zoom=Math.max(el.clientWidth/vh,1.05);gl.draw({t,cam:t*.006+st/vh*.5,season:1.5,spread:-2.85/zoom,bleed:.3,zoom,water:.16,sun:[.25,.58],px:ptr.x,py:ptr.y},ms)}
    if(ref<=anchors[0][0])p=0;else if(ref>=anchors[3][0])p=3;else for(let i=1;i<4;i++)if(ref<=anchors[i][0]){p=lerp(i-1,i,(ref-anchors[i-1][0])/(anchors[i][0]-anchors[i-1][0]));break}
    if(Math.abs(p-lastP)>.002){lastP=p;const i=Math.min(2,Math.floor(p)),k=sm(p-i),m=(a,b)=>`rgb(${a.map((v,j)=>Math.round(lerp(v,b[j],k))).join(',')})`;
      el.style.setProperty('--w1',m(WASH[i][0],WASH[i+1][0]));el.style.setProperty('--w2',m(WASH[i][1],WASH[i+1][1]));
      const idx=Math.round(p);nav.forEach((b,j)=>b.classList.toggle('on',j===idx&&st>vh*.5))}
    for(const c of chs){if(c.t<0||!c.S||c.drawn>=c.S.length)continue;c.t+=dt;
      const k=REDUCED?1:clamp(c.t/5.2),to=Math.min(c.S.length,Math.ceil((k*k*(3-2*k)*.35+k*.65)*c.S.length));
      if(to>c.drawn){paint(c.g,c.S,c.drawn,to);c.drawn=to}}
    const hero=st<vh*.7;fx.w=hero?{snow:.5,rain:0,petal:0,glow:0,leaf:0}:{snow:.7*bump(p,0,.6),rain:.45*bump(p,1,.45),petal:.25*bump(p,1,.5),glow:.6*bump(p,2,.6),leaf:.55*bump(p,3,.6)};
    fx.wind=20+30*bump(p,3,.6);fx.step(dt,t);
  }
  return{build,resize,frame,built:false};
})();

/* ================= DEMO 3 : 观山 ================= */
const D3=(()=>{
  const el=$('#d3');let gl,fx,A=0,k=0,f=0,busy=false,next=-1,hold=4.2,autoplay=true,drop=[.5,.5],els,swapped=true,camX=0,drag=null,lastD=-1;
  const WASHC=[hex('#c3ccd6'),hex('#d3e6d6'),hex('#bfe0dc'),hex('#f0cf9c')];
  function build(){
    el.innerHTML=`<div class="wall"></div><div class="grain"></div>
    <div class="bigch swap"></div><div class="sub3 swap"></div>
    <div class="moon" role="button" aria-label="轻点落墨，换一个季节" tabindex="0"><canvas class="gl"></canvas><canvas class="fx"></canvas></div>
    <canvas class="enso"></canvas><div class="inter"></div>
    <div class="poem3 swap"></div>
    <div class="pills" role="group" aria-label="季节">${SEASONS.map((s,i)=>`<button data-i="${i}" aria-label="${s.zh}天">${s.zh}</button>`).join('')}<button class="auto on" data-i="auto">自动</button></div>
    ${brandHTML}`;
    $('.grain',el).style.backgroundImage=`url(${GRAIN})`;
    gl=new InkGL($('.moon .gl',el));fx=new Weather($('.moon .fx',el),{density:.9});
    els={moon:$('.moon',el),enso:$('.enso',el),big:$('.bigch',el),sub:$('.sub3',el),poem:$('.poem3',el),inter:$('.inter',el),pills:$$('.pills button',el)};
    els.pills.forEach(b=>b.addEventListener('click',()=>{if(b.dataset.i==='auto'){autoplay=!autoplay;hold=.3}else{autoplay=false;drop=[.5,.5];go(+b.dataset.i)}sync()}));
    const m=els.moon;
    m.addEventListener('pointerdown',e=>{drag={x:e.clientX,x0:e.clientX,t:performance.now()};m.setPointerCapture(e.pointerId)});
    m.addEventListener('pointermove',e=>{if(!drag)return;camX-=(e.clientX-drag.x)*.004;drag.x=e.clientX});
    const up=e=>{if(!drag)return;const moved=Math.abs(e.clientX-drag.x0),r=m.getBoundingClientRect();
      if(moved<8&&performance.now()-drag.t<500){drop=[(e.clientX-r.left)/r.width,1-(e.clientY-r.top)/r.height];autoplay=false;go((A+1)%4);sync()}drag=null};
    m.addEventListener('pointerup',up);m.addEventListener('pointercancel',()=>{drag=null});
    m.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();autoplay=false;drop=[.5,.5];go((A+1)%4);sync()}});
    label(0);
  }
  function label(i){const s=SEASONS[i];els.big.textContent=s.zh;els.sub.innerHTML=`${s.sub}　<i>${s.en}</i>`;els.poem.innerHTML=s.poem.map(l=>`<p class="l">${l}</p>`).join('')+`<p class="by">${s.by}</p>`}
  function go(j){if(j===A&&!busy)return;if(busy){next=j;return}k=((j-A)%4+4)%4;if(!k)return;f=0;busy=true;swapped=false;[els.big,els.sub,els.poem].forEach(e=>e.classList.add('out'))}
  function sync(){const tgt=busy?(A+k)%4:A;els.pills.forEach(b=>b.classList.toggle('on',b.dataset.i==='auto'?autoplay:+b.dataset.i===tgt))}
  function resize(){
    gl.resize();fx.resize();const D=els.moon.clientWidth;
    if(Math.abs(D-lastD)>2){lastD=D;const E=D*1.2,d=Math.min(devicePixelRatio||1,2),c=els.enso;c.width=E*d;c.height=E*d;c.style.width=c.style.height=E+'px';c.style.margin=`${-E/2}px 0 0 ${-E/2}px`;
      const g=c.getContext('2d');g.setTransform(d,0,0,d,0,0);seed=77;const S=[],R=D*.5+E*.018,pts=[];
      for(let i=0;i<=56;i++){const q=i/56,a=-1.15+q*6.283*.972,w=E*.052*(.5+.75*Math.pow(Math.sin(Math.min(1,q*1.2)*3.1416),.5))*(q>.9?Math.max(.12,(1-q)*10):1);pts.push([E/2+Math.cos(a)*R*(1+.006*Math.sin(a*3)),E/2+Math.sin(a)*R*(1+.004*Math.cos(a*2)),Math.max(1.2,w)])}
      stroke(S,pts,{dry:.36,a:.92,seg:7,dryF:.007});paint(g,S,0,S.length)}
    sync();
  }
  function frame(dt,t,ms){
    if(busy){f+=dt/2.8;if(!swapped&&f>.42){swapped=true;label((A+k)%4);[els.big,els.sub,els.poem].forEach(e=>e.classList.remove('out'))}
      if(f>=1){A=(A+k)%4;k=0;f=0;busy=false;hold=5;if(next>=0){const n=next;next=-1;go(n)}sync()}}
    else if(autoplay){hold-=dt;if(hold<=0){drop=[.3+Math.random()*.4,.35+Math.random()*.3];go((A+1)%4);sync()}}
    const e=sm(f),sv=A+k*e;
    if(!drag&&!REDUCED)camX+=dt*.012;
    gl.draw({t,cam:camX,season:A,mix:k,th:busy?1.22-1.5*e:2,zoom:1.3,water:.22,sun:[.68,.74],drop,px:ptr.x*.6,py:ptr.y*.6},ms);
    const i0=Math.floor(sv)%4,c0=WASHC[i0],c1=WASHC[(i0+1)%4],kk=sm(sv-Math.floor(sv));
    el.style.setProperty('--wash',`rgb(${c0.map((v,j)=>Math.round(lerp(v,c1[j],kk))).join(',')})`);
    let best=INTER[0];const sm4=((sv%4)+4)%4;for(const it of INTER)if(Math.abs(sm4-it[0])<Math.abs(sm4-best[0]))best=it;
    if(els.inter.textContent!==best[1])els.inter.textContent=best[1];els.inter.style.opacity=(busy&&k===1?bump(sm4,best[0],.2):0).toFixed(3);
    fx.w=wts(sv);fx.wind=windOf(sv);fx.step(dt,t);
  }
  return{build,resize,frame,built:false,go(j){autoplay=false;go(j);sync()},set(j,ff){A=j;k=ff?1:0;f=ff||0;busy=!!ff;swapped=true;autoplay=false;label(j);[els.big,els.sub,els.poem].forEach(e=>e.classList.remove('out'));sync()}};
})();

/* ================= shell ================= */
const DEMOS={d1:D1,d2:D2,d3:D3};let cur=null;
function show(id){
  cur=DEMOS[id];
  $$('.demo').forEach(s=>s.classList.toggle('on',s.id===id));
  $$('#dock button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===id));
  if(!cur.built){cur.build();cur.built=true}
  cur.resize();
}
GRAIN=grainURL();
$$('#dock button').forEach(b=>b.addEventListener('click',()=>show(b.dataset.t)));
let rz=0;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>cur&&cur.resize(),140)});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>cur&&cur.resize());
let last=performance.now();
function tick(now){
  const ms=now-last,dt=Math.min(.05,ms/1000);last=now;
  ptr.x+=(ptr.tx-ptr.x)*.08;ptr.y+=(ptr.ty-ptr.y)*.08;
  if(cur&&!document.hidden)cur.frame(dt,now/1000,ms);
  requestAnimationFrame(tick);
}
show('d1');requestAnimationFrame(tick);
window.__demo={show,d1p:v=>D1.setP(v),d3go:j=>D3.go(j),d3set:(j,f)=>D3.set(j,f)};
})();
</script>
