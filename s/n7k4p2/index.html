<style>

}footer{font-size:10px;color:#6a827a;text-align:center;padding:0 20px 20px;line-height:1.7}footer a{text-decoration:none}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:650px){header{padding:21px 23px}main{padding:12px 18px 35px;align-items:flex-start}.gate{grid-template-columns:1fr;min-height:0}.picture{min-height:170px;background-position:35% 61%}.quote{font-size:21px;left:19px;right:auto;bottom:14px;padding:11px 16px}.form-panel{padding:29px 27px 25px}h1{font-size:30px;margin-top:18px}.subtitle{margin-bottom:20px}.error{min-height:28px}}
</style></head><body><header><a href="/">TimeMemo</a></header><main><div class="gate"><div class="picture" role="img" aria-label="Cruise travel photograph"><div class="quote">A little time away.</div></div><div class="form-panel"><div class="kicker">PRIVATE TRAVEL NOTES</div><h1>私人旅行笔记</h1><p class="subtitle">A journey, in the making.</p><p class="explain">输入访问密码，查看中英文旅行对比。<br>Enter the access code to view the bilingual travel notes.</p><form id="unlock-form"><label for="access">访问密码 · Access code</label><input id="access" type="password" inputmode="numeric" autocomplete="off" required autofocus><button id="unlock-button" type="submit">打开笔记 · Open notes →</button><p class="error" id="message" role="status" aria-live="polite"></p></form><a class="back" href="/">← 返回主页 · Back to home</a></div></div></main><footer>Photo: <a href="https://commons.wikimedia.org/wiki/File:Celebrity_Solstice_Juneau_20260618.jpg" rel="noopener noreferrer nofollow" target="_blank">Z thomas / Wikimedia Commons</a> · <a href="https://creativecommons.org/licenses/by/4.0/" rel="noopener noreferrer nofollow" target="_blank">CC BY 4.0</a> · Cropped for layout</footer>
<script>
const decode64=value=>Uint8Array.from(atob(value),c=>c.charCodeAt(0));
document.getElementById('unlock-form').addEventListener('submit',async event=>{
event.preventDefault();
const button=document.getElementById('unlock-button'),message=document.getElementById('message'),input=document.getElementById('access');
if(!globalThis.crypto?.subtle){message.textContent='请使用 HTTPS 链接打开。Please open the HTTPS link.';return;}
button.disabled=true;message.textContent='正在打开… Opening…';
let payload;
try{const response=await fetch('content.enc.json',{cache:'no-store',credentials:'omit'});if(!response.ok)throw new Error('network');payload=await response.json();}
catch{message.textContent='暂时无法加载，请重试。Unable to load; please try again.';button.disabled=false;return;}
try{
const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(input.value),'PBKDF2',false,['deriveKey']);input.value='';
const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:decode64(payload.salt),iterations:payload.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode64(payload.iv)},key,decode64(payload.ciphertext));
document.open();document.write(new TextDecoder().decode(clear));document.close();
}catch{message.textContent='密码不正确，请重试。Incorrect access code; try again.';button.disabled=false;input.focus();}
});
</script></body></html>
