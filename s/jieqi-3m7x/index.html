<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>节气与树影</title>
<link rel="preload" href="nssc-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="nssc-200.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"NSSC";src:url(nssc-200.woff2) format("woff2");font-weight:200;font-display:swap}
@font-face{font-family:"NSSC";src:url(nssc-300.woff2) format("woff2");font-weight:300;font-display:swap}
@font-face{font-family:"NSSC";src:url(nssc-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"NSSC";src:url(nssc-500.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"CG";src:url(cg-400.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"CG";src:url(cg-400i.woff2) format("woff2");font-weight:400;font-style:italic;font-display:swap}
</style>
<style>
*{box-sizing:border-box}
:root{
  /* layout: one fixed scene per demo, scroll drives the seasons; type sits left, the picture breathes */
  color-scheme:light;
  --paper:#eceeeb; --ink:#22272c; --mute:#7b838a; --hair:rgba(34,39,44,.3); --dot:#c0432c;
  --chrome:rgba(238,240,237,.78); --chrome-line:rgba(34,39,44,.16); --chrome-ink:#7b838a; --chrome-on:#22272c;
  --zh:"NSSC","Noto Serif SC","Noto Serif CJK SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  --en:"CG","Cormorant Garamond","Iowan Old Style","Palatino Linotype",Georgia,serif;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%}
body{height:100%;margin:0;background:var(--paper);overflow:hidden;font-family:var(--zh);font-weight:400;color:var(--ink);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
p,h1,h2{margin:0;font-weight:inherit}

.demo{position:fixed;inset:0;display:none;overflow:hidden;background:var(--paper);color:var(--ink)}
.demo.on{display:block}
.full{position:absolute;inset:0;width:100%;height:100%;display:block}
.fx{pointer-events:none;z-index:4}
.scroller{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;z-index:6;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}

.mark{position:absolute;left:0;top:0;z-index:8;display:flex;align-items:baseline;gap:10px;pointer-events:none;
  padding:calc(20px + env(safe-area-inset-top,0px)) 0 0 7vw}
.mark i{width:5px;height:5px;border-radius:50%;background:var(--dot);align-self:center;margin-right:2px}
.mark b{font-weight:400;font-size:15px;letter-spacing:.5em}
.mark span{font-family:var(--en);font-size:11.5px;letter-spacing:.34em;color:var(--mute)}
.snav{position:absolute;right:calc(7vw - 10px);top:calc(9px + env(safe-area-inset-top,0px));z-index:9;display:flex}
.snav button{border:0;background:none;width:32px;height:42px;padding:0;font-size:14px;font-weight:300;color:var(--mute);position:relative;transition:color .5s}
.snav button.on{color:var(--ink);font-weight:500}
.snav button::after{content:"";position:absolute;left:50%;bottom:5px;width:3px;height:3px;margin-left:-1.5px;border-radius:50%;background:var(--dot);opacity:0;transition:opacity .5s}
.snav button.on::after{opacity:1}

.hero{position:absolute;left:7vw;z-index:7;pointer-events:none;will-change:opacity,transform}
.hero h1{font-weight:200;font-size:clamp(44px,min(13.6vw,17vh),108px);letter-spacing:.16em;line-height:1.16;white-space:nowrap}
.hero h1 span{display:inline-block;opacity:0;filter:blur(10px);transform:translateY(.18em);animation:settle 1.5s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i)*.16s + .25s)}
.hero p{opacity:0;animation:settle 1.6s ease forwards;animation-delay:1.1s}
.hero p.zh{animation-delay:1.45s}
@keyframes settle{to{opacity:var(--o,1);filter:blur(0);transform:none}}
.hero p{font-family:var(--en);font-style:italic;font-size:clamp(15px,4.2vw,20px);letter-spacing:.08em;color:var(--mute);margin-top:10px}
.hero .zh{font-family:var(--zh);font-style:normal;font-size:13px;letter-spacing:.5em;color:var(--ink);--o:.8;margin-top:16px}

.sea{position:absolute;left:7vw;z-index:7;pointer-events:none;opacity:0;will-change:opacity,transform,filter}
.sea .row{display:flex;align-items:flex-start;gap:16px}
.sea .ch{font-weight:200;font-size:clamp(68px,min(21vw,23vh),150px);line-height:1;margin-left:-.05em}
.sea .sub{writing-mode:vertical-rl;font-size:13px;letter-spacing:.72em;padding-top:1.2em;white-space:nowrap}
.sea .sub i{font-family:var(--en);font-style:italic;font-size:13.5px;letter-spacing:.12em;color:var(--mute)}
.sea .line{margin-top:12px;font-size:14px;line-height:2.05;letter-spacing:.09em;max-width:16.5em;color:rgba(34,39,44,.86)}
.sea .slot{margin-top:14px;padding-top:10px;border-top:1px solid var(--hair);display:inline-block;font-size:11.5px;letter-spacing:.34em;color:var(--mute)}

.hint{position:absolute;left:0;right:0;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:7;text-align:center;font-size:11.5px;letter-spacing:.5em;text-indent:.5em;color:var(--mute);pointer-events:none}
.hint::after{content:"";display:block;width:1px;height:22px;margin:8px auto 0;background:var(--ink);opacity:.5;transform-origin:top;animation:nudge 2.2s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:scaleY(.25)}55%{transform:scaleY(1)}}
.play{position:absolute;right:7vw;bottom:calc(13px + env(safe-area-inset-bottom,0px));z-index:9;width:38px;height:38px;border-radius:50%;border:1px solid var(--hair);
  background:rgba(238,240,237,.5);padding:0;display:grid;place-items:center;color:var(--ink)}
.play svg{width:11px;height:11px;display:block}
.play .pa{display:none} .play.on .pl{display:none} .play.on .pa{display:block}

/* ---------- Demo 1 : 节气 ---------- */
#d1 .gl.nogl{background:linear-gradient(180deg,#c3cbd2,#e8ebec 60%,#cfd6dc)}
#d1 .tall{height:940%}
#d1 .hero{top:calc(82px + env(safe-area-inset-top,0px))}
#d1 .sea{top:calc(64px + env(safe-area-inset-top,0px))}
#d1 .sea .line{max-width:20em}
#d1 .dial{position:absolute;z-index:5;pointer-events:none;overflow:visible}
#d1 .dial .rot{will-change:transform}
#d1 .dial .hl{fill:none;stroke:var(--ink);stroke-width:.55;opacity:.5;stroke-dasharray:579;stroke-dashoffset:579;animation:draw 2.6s .3s cubic-bezier(.4,0,.2,1) forwards}
#d1 .dial .tk{opacity:0;animation:settle 1.6s 1.5s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
#d1 .dial line{stroke:var(--ink);stroke-width:.5;opacity:.55}
#d1 .dial line.mn{opacity:.3;stroke-width:.4}
#d1 .dial text{font-family:var(--zh);font-size:6.6px;font-weight:300;fill:var(--ink);text-anchor:middle;opacity:.72}
#d1 .dial .now{fill:var(--dot)}
#d1 .dial .ptr{stroke:var(--dot);stroke-width:.9;opacity:1}
#d1 .term{position:absolute;z-index:7;text-align:center;pointer-events:none;width:260px;margin-left:-130px;transition:opacity .45s ease,filter .5s ease}
#d1 .term.out{opacity:0;filter:blur(6px)}
#d1 .term .no{display:block;font-family:var(--en);font-size:12px;letter-spacing:.3em;text-indent:.3em;color:var(--mute)}
#d1 .term b{display:block;font-weight:300;font-size:27px;letter-spacing:.62em;text-indent:.62em;margin-top:2px}
#d1 .term .hou{display:block;font-size:12.5px;letter-spacing:.52em;text-indent:.52em;margin-top:7px}
#d1 .term em{display:block;font-family:var(--en);font-style:italic;font-size:13.5px;color:var(--mute);margin-top:3px;letter-spacing:.05em}
#d1 .end{position:absolute;left:7vw;top:calc(84px + env(safe-area-inset-top,0px));z-index:7;pointer-events:none;opacity:0}
#d1 .end p{font-weight:300;font-size:clamp(20px,5.6vw,30px);letter-spacing:.36em;line-height:2}
#d1 .end small{display:block;margin-top:12px;font-size:11.5px;letter-spacing:.5em;color:var(--mute)}

/* ---------- Demo 2 : 树影 ---------- */
#d2 .wall{position:absolute;inset:0;background:radial-gradient(130% 90% at 62% 30%,var(--w1,#dfe2e3),var(--w2,#c9ced2))}
#d2 .glow{position:absolute;z-index:1;border-radius:50%;pointer-events:none;background:radial-gradient(closest-side,var(--lg,rgba(255,255,255,.5)),rgba(255,255,255,0));will-change:transform,opacity}
#d2 .lt{z-index:2;pointer-events:none;will-change:filter}
#d2 .tex{position:absolute;inset:0;z-index:3;pointer-events:none;mix-blend-mode:multiply;opacity:.55}
#d2 .floor{position:absolute;left:0;right:0;bottom:0;height:30%;z-index:3;pointer-events:none;background:linear-gradient(180deg,rgba(40,44,50,0),rgba(40,44,50,.1))}
#d2 .tall{height:760%}
#d2 .hero{bottom:calc(138px + env(safe-area-inset-bottom,0px))}
#d2 .sea{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
#d2 .hero h1{font-size:clamp(42px,min(12.6vw,17vh),100px)}

/* ---------- dock ---------- */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;pointer-events:none;
  padding:0 10px calc(12px + env(safe-area-inset-bottom,0px))}
#dock div{pointer-events:auto;display:flex;align-items:center;padding:0 6px;border-radius:2px;background:var(--chrome);border:1px solid var(--chrome-line);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#dock button{border:0;background:none;color:var(--chrome-ink);font-size:13px;letter-spacing:.42em;text-indent:.42em;line-height:1;padding:12px 14px;position:relative;transition:color .3s}
#dock button[aria-selected="true"]{color:var(--chrome-on)}
#dock button[aria-selected="true"]::after{content:"";position:absolute;left:14px;right:14px;bottom:6px;height:1px;background:var(--chrome-on)}
#dock button+button{margin-left:2px}

@media (min-aspect-ratio:1/1){
  .mark{padding-left:6vw} .snav{right:calc(6vw - 10px)}
  .hero,.sea{left:6vw}
  #d1 .hero{top:22vh} #d1 .sea{top:19vh} #d1 .end{left:6vw;top:20vh}
  #d2 .hero,#d2 .sea{bottom:auto;top:26vh}
  .sea .line{font-size:15.5px;max-width:19em}
  .play{right:6vw}
}
@media (max-height:700px) and (max-aspect-ratio:1/1){
  .sea .ch{font-size:76px} .sea .line{font-size:13px;line-height:1.9;margin-top:8px}
  #d1 .sea{top:calc(56px + env(safe-area-inset-top,0px))}
  #d1 .term b{font-size:22px}
  #d1 .sea .line{display:none}
  #d1 .hero .zh{margin-top:10px}
}
@media (prefers-reduced-motion:reduce){.hint::after{animation:none}#d1 .term{transition:none}.hero h1 span,.hero p,#d1 .dial .hl,#d1 .dial .tk{animation-duration:.01s;animation-delay:0s}}
</style>
</head>
<body>
<section id="d1" class="demo on" aria-label="节气：远山与二十四节气"></section>
<section id="d2" class="demo" aria-label="树影：粉墙上的光影"></section>
<nav id="dock" aria-label="切换 Demo"><div role="tablist">
  <button role="tab" aria-selected="true" data-t="d1">节气</button>
  <button role="tab" aria-selected="false" data-t="d2">树影</button>
</div></nav>

<script>
(()=>{'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x, lerp=(a,b,t)=>a+(b-a)*t;
const sm=x=>{x=clamp(x);return x*x*(3-2*x)};
const bumpL=(p,c,w)=>sm(1-Math.abs(p-c)/w);
const REDUCED=matchMedia('(prefers-reduced-motion:reduce)').matches;
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const rgb=(c,a)=>a==null?`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`:`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const mix3=(a,b,k)=>[lerp(a[0],b[0],k),lerp(a[1],b[1],k),lerp(a[2],b[2],k)];
const escH=t=>t.replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const QS=new URLSearchParams(location.search);
const NAME=escH((QS.get('n')||'四季').slice(0,4)),NAME_EN=escH((QS.get('en')||'FOUR SEASONS').slice(0,28).toUpperCase());

/* ================= content ================= */
const SEASONS=[
  {zh:'冬',sub:'初始',en:'Winter',line:'万物收藏，一切从安静里开始。',line2:'枝头空着，光很安静。故事从这里开始。',slot:'关于 · 一段自述与一张旧照'},
  {zh:'春',sub:'生长',en:'Spring',line:'雨水落过，草木一夜之间有了颜色。',line2:'雨落过几场，新叶一片一片长出来。',slot:'经历 · 求学与远行'},
  {zh:'夏',sub:'盛放',en:'Summer',line:'光最盛的时候，长成自己的样子。',line2:'树影最浓的时候，也是光最亮的时候。',slot:'作品 · 研究与创作'},
  {zh:'秋',sub:'收获',en:'Autumn',line:'把走过的路，酿成一山秋色。',line2:'叶子落下来，光照进了更深的地方。',slot:'家人 · 合影与致谢'}];
// 二十四节气：名称、物候（取自七十二候）、英文、约略起始月日
const TERMS=[
 ['立冬','水始冰','Start of Winter',11,7],['小雪','虹藏不见','Minor Snow',11,22],['大雪','荔挺出','Major Snow',12,7],['冬至','水泉动','Winter Solstice',12,21],['小寒','雁北乡','Minor Cold',1,5],['大寒','水泽腹坚','Major Cold',1,20],
 ['立春','东风解冻','Start of Spring',2,4],['雨水','草木萌动','Rain Water',2,19],['惊蛰','桃始华','Awakening of Insects',3,5],['春分','玄鸟至','Spring Equinox',3,20],['清明','桐始华','Pure Brightness',4,4],['谷雨','萍始生','Grain Rain',4,20],
 ['立夏','蝼蝈鸣','Start of Summer',5,5],['小满','麦秋至','Grain Buds',5,21],['芒种','螳螂生','Grain in Ear',6,5],['夏至','半夏生','Summer Solstice',6,21],['小暑','温风至','Minor Heat',7,7],['大暑','腐草为萤','Major Heat',7,22],
 ['立秋','凉风至','Start of Autumn',8,7],['处暑','天地始肃','End of Heat',8,23],['白露','鸿雁来','White Dew',9,7],['秋分','雷始收声','Autumn Equinox',9,23],['寒露','菊有黄华','Cold Dew',10,8],['霜降','草木黄落','Frost’s Descent',10,23]];
const todayTerm=(()=>{const d=new Date(),key=(d.getMonth()+1)*100+d.getDate();let best=3,bk=-1;
  TERMS.forEach((t,i)=>{const k=t[3]*100+t[4];if(k<=key&&k>bk){bk=k;best=i}});return best})();
const markHTML=`<div class="mark"><i></i><b>${NAME}</b><span>${NAME_EN}</span></div>`;
const snavHTML=`<div class="snav" role="group" aria-label="季节">${SEASONS.map((s,i)=>`<button data-i="${i}" aria-label="${s.zh}天">${s.zh}</button>`).join('')}</div>`;
const playHTML=`<button class="play" type="button" aria-label="自动播放"><svg class="pl" viewBox="0 0 10 10"><path d="M2.2 1v8l6.6-4z" fill="currentColor"/></svg><svg class="pa" viewBox="0 0 10 10"><path d="M2 1h2v8H2zM6 1h2v8H6z" fill="currentColor"/></svg></button>`;
const titleHTML=[...'一生四季'].map((c,i)=>`<span style="--i:${i}">${c}</span>`).join('');
const seaHTML=(s,k)=>`<div class="sea"><div class="row"><div class="ch">${s.zh}</div><div class="sub">${s.sub}　<i>${s.en}</i></div></div><p class="line">${k?s.line2:s.line}</p>${k?`<span class="slot">${s.slot}</span>`:''}</div>`;

/* ================= pointer ================= */
const ptr={x:0,y:0,tx:0,ty:0};
addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;ptr.tx=e.clientX/innerWidth*2-1;ptr.ty=e.clientY/innerHeight*2-1},{passive:true});
if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission!=='function'){
  addEventListener('deviceorientation',e=>{if(e.gamma==null)return;ptr.tx=clamp(e.gamma/30,-1,1);ptr.ty=clamp((e.beta-45)/34,-1,1)},{passive:true});
}

/* ================= shared: scroll-driven progress with autoplay ================= */
function Driver(sc,PMIN,PMAX,btn,dur){
  let pS=PMIN,auto=null;const max=()=>sc.scrollHeight-sc.clientHeight;
  const stop=()=>{if(auto){auto=null;btn.classList.remove('on');btn.setAttribute('aria-label','自动播放')}};
  btn.addEventListener('click',()=>{if(auto)return stop();const m=max();if(sc.scrollTop>m-4)sc.scrollTop=0;auto={from:sc.scrollTop,t:0,dur:dur*(1-sc.scrollTop/m)};btn.classList.add('on');btn.setAttribute('aria-label','暂停')});
  ['wheel','touchstart','keydown'].forEach(ev=>sc.addEventListener(ev,stop,{passive:true}));
  return{
    step(dt){const m=max();if(auto){auto.t+=dt;const k=clamp(auto.t/auto.dur);sc.scrollTop=lerp(auto.from,m,k);if(k>=1)stop()}
      const pT=m>0?lerp(PMIN,PMAX,sc.scrollTop/m):PMIN;pS+=(pT-pS)*(1-Math.exp(-dt*5));if(Math.abs(pT-pS)<.0004)pS=pT;return pS},
    to(v,smooth){stop();sc.scrollTo({top:max()*(v-PMIN)/(PMAX-PMIN),behavior:smooth&&!REDUCED?'smooth':'auto'})},
    jump(v){stop();sc.scrollTop=max()*(v-PMIN)/(PMAX-PMIN);pS=v}
  };
}

/* ================= DEMO 1 : 节气 — ink-wash horizon shader ================= */
const V=h=>{const c=hex(h);return `vec3(${(c[0]/255).toFixed(3)},${(c[1]/255).toFixed(3)},${(c[2]/255).toFixed(3)})`};
const P4=(a,b,c,d)=>`pal(${V(a)},${V(b)},${V(c)},${V(d)},sp)`;
const FRAG=`precision highp float;
uniform vec2 uRes,uSun,uPar;uniform float uT,uCam,uS,uSpread,uZoom,uWl,uSunR,uRain,uTop,uH;
float hash(vec2 p){p=mod(p,289.);return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x),f.y);}
float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*noise(p);p=p*2.03+vec2(17.3,9.1);a*=.5;}return s/.9375;}
float fbm2(vec2 p){return (noise(p)*.62+noise(p*2.07+vec2(11.,5.))*.38);}
float ridge(float x,float sd){
  float w=x+.4*(noise(vec2(x*.7,sd+11.))-.5);
  float n=fbm(vec2(w,sd));
  float c=1.-abs(2.*noise(vec2(w*2.6+3.,sd+7.))-1.);
  return smoothstep(.2,.88,n)*.72+c*c*.2+noise(vec2(w*6.,sd+2.))*.08;}
vec3 pal(vec3 a,vec3 b,vec3 c,vec3 d,float s){
  if(s<1.)return mix(a,b,smoothstep(0.,1.,s));if(s<2.)return mix(b,c,smoothstep(0.,1.,s-1.));return mix(c,d,smoothstep(0.,1.,s-2.));}
float palf(float a,float b,float c,float d,float s){return pal(vec3(a),vec3(b),vec3(c),vec3(d),s).x;}
void main(){
  vec2 uv=gl_FragCoord.xy/uRes;float asp=uRes.x/uRes.y;
  float wx=(uv.x-.5)*uZoom;
  float bl=fbm(vec2(wx*1.2+uCam*.2,uv.y*1.6)+4.);
  float sp=clamp(uS+uSpread*wx+.34*(bl-.5)*min(1.,abs(uSpread)*4.),0.,3.);
  vec3 paper=${P4('#e7eaec','#ebefe8','#e7efed','#f2ebe0')};
  vec3 skyT=${P4('#b7c0c9','#cddcd3','#b3d2d3','#e8d0ad')};
  vec3 farC=${P4('#8c98a6','#8aad9f','#5a94a0','#b98b72')};

class Weather{
  constructor(cv){this.cv=cv;this.g=cv.getContext('2d');this.ps=[];this.w={snow:0,rain:0,petal:0,glow:0,leaf:0};this.wind=16;this.geese=0;this.resize()}

  }
  spawn(q,any){

    if(tot<.03||q.i/n>Math.min(1,tot*1.05)){q.t=null;q.wait=.25+Math.random()*.8;return}

    const z=q.z=.5+Math.random()*.9;q.t=t;q.ph=Math.random()*6.28;q.k=(Math.random()*3)|0;
    q.x=Math.random()*(this.W+200)-100;q.y=any?Math.random()*this.H:-30;q.rot=Math.random()*6.28;q.life=0;
    if(t==='snow'){q.vy=22+30*z;q.sz=(1+Math.random()*1.7)*z}
    else if(t==='rain'){q.vy=640+420*z;q.len=18+24*z}

      if(depth>=1)for(let q=0;q<3;q++)LV.push({s:prev,t:1,side:1,a:(q-1)*.62+(rnd()-.5)*.3,sz:.85+.5*rnd(),ph:rnd()*6.28,born:rnd()*.55,fall:rnd()});
    };
    while(Q.length)chain(...Q.shift());
    return{S,LV,BL,o};
  }
  function pose(T,t,wind){
    const S=T.S,o=T.o;
    for(let i=0;i<S.length;i++){const s=S[i];
      const sw=(Math.sin(t*(.55+.22*s.d)+s.ph)*.034+Math.sin(t*1.6+s.ph*1.3)*.012)*s.fx*wind;
      if(s.p<0){s.x0=o.x;s.y0=o.y;s.A=s.a+sw*.3}
      else{const q=S[s.p];s.x0=q.x0+(q.x1-q.x0)*s.t;s.y0=q.y0+(q.y1-q.y0)*s.t;s.A=q.A+s.a+sw}
      s.x1=s.x0+Math.cos(s.A)*s.len;s.y1=s.y0+Math.sin(s.A)*s.len}
  }
  function drawTree(c,T,B,st,t){
    const S=T.S;c.setTransform(B[0],B[1],B[2],B[3],B[4],B[5]);c.lineCap='round';
    for(let i=0;i<S.length;i++){const s=S[i];c.lineWidth=Math.max(.0028,(s.w0+s.w1)*.5);c.beginPath();c.moveTo(s.x0,s.y0);c.lineTo(s.x1,s.y1);c.stroke()}
    if(st.bloom>.01){
      for(const b of T.BL){const s=S[b.s],x=s.x0+(s.x1-s.x0)*b.t,y=s.y0+(s.y1-s.y0)*b.t;
        const bk=Math.max(.24,sm((st.open-b.born*.5)/.5))*st.bloom,r=.0105*b.r*bk;if(r<.0012)continue;
        c.beginPath();
        if(bk<.4){c.arc(x,y,r*1.5,0,6.283)}else for(let q=0;q<5;q++){const a=b.ph+q*1.2566;c.moveTo(x+Math.cos(a)*r*.95+r*.82,y+Math.sin(a)*r*.95);c.arc(x+Math.cos(a)*r*.95,y+Math.sin(a)*r*.95,r*.82,0,6.283)}
        c.fill()}
    }
    if(st.grow>.01){
      const base=.062*st.size;
      for(const l of T.LV){if(l.fall<st.fall*.95)continue;const gk=clamp((st.grow-l.born*.62)/.38);if(gk<=0)continue;
        const s=S[l.s],x=s.x0+(s.x1-s.x0)*l.t,y=s.y0+(s.y1-s.y0)*l.t,sz=base*l.sz*(.25+.75*gk);
        const ang=s.A+l.side*l.a+Math.sin(t*2.1+l.ph)*.2*st.wind,fl=.5+.5*Math.abs(Math.cos(t*1.2*st.wind+l.ph));
        c.setTransform(B[0],B[1],B[2],B[3],B[4],B[5]);c.translate(x,y);c.rotate(ang);c.scale(sz,sz*fl);c.fill(LEAF)}
    }
  }
  function build(){
    el.innerHTML=`<div class="wall"></div><div class="glow"></div><canvas class="lt full"></canvas><div class="tex"></div><div class="floor"></div>
    <div class="scroller" tabindex="0" aria-label="滚动，看同一棵树走过四季"><div class="tall"></div></div>
    <div class="hero"><h1 aria-label="一生四季">${titleHTML}</h1><p>A life in four seasons</p><p class="zh">粉墙为纸　光影作画</p></div>
    ${SEASONS.map(s=>seaHTML(s,1)).join('')}
    ${markHTML}${snavHTML}${playHTML}<div class="hint">向上滑动</div>`;
    sc=$('.scroller',el);cv=$('.lt',el);g=cv.getContext('2d');off=document.createElement('canvas');og=off.getContext('2d');
    seas=$$('.sea',el);els={hero:$('.hero',el),hint:$('.hint',el),nav:$$('.snav button',el),glow:$('.glow',el),wall:$('.wall',el)};
    // plaster tooth
    const c=document.createElement('canvas');c.width=c.height=200;const x=c.getContext('2d'),im=x.createImageData(200,200);
    for(let i=0;i<im.data.length;i+=4){const v=236+Math.random()*19;im.data[i]=v;im.data[i+1]=v;im.data[i+2]=v-2;im.data[i+3]=255}x.putImageData(im,0,0);
    $('.tex',el).style.backgroundImage=`url(${c.toDataURL()})`;
    drv=Driver(sc,PMIN,PMAX,$('.play',el),52);
    els.nav.forEach(b=>b.addEventListener('click',()=>drv.to(+b.dataset.i,true)));
    for(let i=0;i<70;i++)parts.push({t:null,wait:Math.random()*.6,i});
  }
  let G={};
  function resize(){
    W=el.clientWidth;H=el.clientHeight;const port=H>W;
    RS=Math.min(1,(devicePixelRatio||1)*.5);cv.width=Math.round(W*RS);cv.height=Math.round(H*RS);
    off.width=Math.max(2,Math.round(W*RS/5));off.height=Math.max(2,Math.round(H*RS/5));
    const cols=3,rows=4,ch=port?H*(H<700?.094:.107):H*.158,cw=port?W*.205:H*.168,gap=Math.max(6,cw*.075);
    const PW=cols*cw+(cols-1)*gap,PH=rows*ch+(rows-1)*gap;
    G={cols,rows,ch,cw,gap,PW,PH,cx:port?W*.53:W*.66,oy:port?H*.078:H*.13};
    const u=PW/PH; // tree lives in units of PH
    near=genTree(5127,{x:u+.16,y:-.1,ang:Math.atan2(.86,-(u+.1)),len:1.28,w:.034});
    far=genTree(977,{x:u+.42,y:.3,ang:Math.atan2(.36,-(u+.2)),len:1.45,w:.03});
    lastSoft=-1;lastCol=-9;
  }
  function spawn(q,w,any){
    const tot=w.snow+w.rain+w.petal+w.leaf;if(tot<.03||q.i/parts.length>Math.min(1,tot*1.1)){q.t=null;q.wait=.3+Math.random();return}
    let r=Math.random()*tot,t='leaf';for(const k of ['snow','rain','petal','leaf']){if(r<w[k]){t=k;break}r-=w[k]}
    q.t=t;q.ph=Math.random()*6.28;q.rot=Math.random()*6.28;q.life=0;q.z=.6+Math.random()*.8;
    q.x=Math.random()*(G.PW+G.PH*.5)-G.PH*.1;q.y=any?Math.random()*G.PH:-G.PH*.08;
    if(t==='snow'){q.vy=.05+.05*q.z;q.sz=(.007+Math.random()*.008)*q.z}
    else if(t==='rain'){q.vy=1.3+.8*q.z;q.sz=.07+.07*q.z}
    else if(t==='petal'){q.vy=.07+.06*q.z;q.sz=(.013+Math.random()*.01)*q.z;q.vr=(Math.random()-.5)*2}
    else{q.vy=.1+.09*q.z;q.sz=(.04+Math.random()*.03)*q.z;q.vr=(Math.random()-.5)*2.6}
  }
  function frame(dt,t,ms){
    const p=drv.step(dt),s=clamp(p,0,3),i=Math.min(2,Math.floor(s)),k=sm(s-i),L=a=>lerp(a[i],a[i+1],k),C=a=>mix3(a[i],a[i+1],k);
    const rain=Math.max(bumpL(p,.55,.2),.8*bumpL(p,1.55,.15)),wind=1+2.2*bumpL(p,2.62,.3)+.5*bumpL(p,3,.5);
    const LA=L(K.alpha)*(1-.5*rain)*(.93+.07*Math.sin(t*.23));
    if(Math.abs(p-lastCol)>.003){lastCol=p;const w1=C(K.w1),w2=C(K.w2);
      els.wall.style.setProperty('--w1',rgb(mix3(w1,[168,174,184],rain*.35)));els.wall.style.setProperty('--w2',rgb(mix3(w2,[150,157,168],rain*.35)));
      els.glow.style.setProperty('--lg',rgb(C(K.l2),.55))}
    const soft=L(K.soft)+rain*1.1;if(Math.abs(soft-lastSoft)>.08){lastSoft=soft;cv.style.filter=`blur(${soft.toFixed(2)}px)`}
    // geometry of the projected window
    const sk=L(K.skew)+Math.sin(t*.06)*.012+ptr.x*.03,j=.055,PH=G.PH,PW=G.PW;
    const ox=G.cx-PW/2-sk*PH/2,oy=G.oy+L(K.lift)*H+ptr.y*5;
    const B=[PH*RS,PH*j*RS,PH*sk*RS,PH*RS,ox*RS,oy*RS],Bp=[RS,j*RS,sk*RS,RS,ox*RS,oy*RS];
    els.glow.style.width=els.glow.style.height=PH*2+'px';els.glow.style.transform=`translate3d(${(ox+PW/2+sk*PH/2-PH).toFixed(1)}px,${(oy+PH/2-PH).toFixed(1)}px,0)`;els.glow.style.opacity=(LA*.75).toFixed(3);
    const shade=C(K.sh),shade2=C(K.sh2);
    const st={grow:sm((p-.72)/.95),fall:sm((p-2.42)/1.05),size:lerp(.72,1.12,sm((p-1)/1.1)),open:sm((p-.28)/.62),bloom:1-sm((p-1.22)/.42),wind};
    pose(near,t,wind);pose(far,t*.8+3,wind*.8);
    // far foliage: drawn small, scaled up — a soft penumbra
    og.setTransform(1,0,0,1,0,0);og.clearRect(0,0,off.width,off.height);og.strokeStyle=og.fillStyle=rgb(shade2);
    drawTree(og,far,B.map(v=>v/5),st,t*.8);
    // light
    g.setTransform(1,0,0,1,0,0);g.globalCompositeOperation='source-over';g.globalAlpha=1;g.clearRect(0,0,cv.width,cv.height);
    g.setTransform(Bp[0],Bp[1],Bp[2],Bp[3],Bp[4],Bp[5]);
    const gr=g.createLinearGradient(0,0,PW*.3,PH);gr.addColorStop(0,rgb(C(K.l1)));gr.addColorStop(1,rgb(C(K.l2)));g.fillStyle=gr;g.globalAlpha=LA;
    g.beginPath();for(let r=0;r<G.rows;r++)for(let c=0;c<G.cols;c++)g.rect(c*(G.cw+G.gap),r*(G.ch+G.gap),G.cw,G.ch);g.fill();
    g.globalCompositeOperation='source-atop';
    g.setTransform(1,0,0,1,0,0);g.globalAlpha=.62;g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';g.drawImage(off,0,0,cv.width,cv.height);
    g.globalAlpha=1;g.strokeStyle=g.fillStyle=rgb(shade);
    drawTree(g,near,B,st,t);
    // falling things, seen only as shadows inside the light
    const w={snow:bumpL(p,0,.5),rain,petal:bumpL(p,1.3,.34),leaf:bumpL(p,3,.62)+.6*bumpL(p,2.62,.2)};
    g.setTransform(Bp[0],Bp[1],Bp[2],Bp[3],Bp[4],Bp[5]);g.fillStyle=g.strokeStyle=rgb(shade);g.lineCap='round';
    for(const q of parts){
      if(!q.t){q.wait-=dt;if(q.wait<=0){spawn(q,w,!q.seen);q.seen=1}continue}
      if(w[q.t]<.03){spawn(q,w,true);continue}
      q.life+=dt;const a=clamp(w[q.t]*3)*clamp(q.life*2.5);q.y+=q.vy*PH*dt;
      if(q.t==='snow'){q.x+=Math.sin(t*.8+q.ph)*8*dt;g.globalAlpha=a*.6;g.beginPath();g.arc(q.x,q.y,q.sz*PH,0,6.283);g.fill()}
      else if(q.t==='rain'){g.globalAlpha=a*.8;g.lineWidth=Math.max(2,PH*.011);g.beginPath();g.moveTo(q.x,q.y);g.lineTo(q.x,q.y-q.sz*PH);g.stroke()}
      else{const lf=q.t==='leaf';q.rot+=q.vr*dt;q.x+=(Math.sin(t*(lf?1.3:1)+q.ph)*(lf?26:18)-(wind-1)*46)*dt;
        const fl=.3+.7*Math.abs(Math.cos(t*(lf?1.9:1.5)+q.ph)),sz=q.sz*PH;g.globalAlpha=a*(lf?.92:.72);
        g.save();g.translate(q.x,q.y);g.rotate(q.rot);g.scale(sz,sz*fl);if(lf)g.fill(LEAF);else{g.beginPath();g.ellipse(0,0,.5,.34,0,0,6.283);g.fill()}g.restore()}
      if(q.y>PH*1.1||q.x<-PH*.35||q.x>PW+PH*.7)spawn(q,w,false);
    }
    g.globalAlpha=1;g.globalCompositeOperation='source-over';
    // wall text
    const ik=sm((p-PMIN)/.26);els.hero.style.opacity=(1-ik).toFixed(3);els.hero.style.transform=`translate3d(0,${(-ik*20).toFixed(1)}px,0)`;els.hero.style.filter=ik>.02?`blur(${(ik*8).toFixed(1)}px)`:'none';
    seas.forEach((e,n)=>{const a=(n?sm((p-n+.34)/.14):sm((p+.1)/.12))*(n===3?1:1-sm((p-n-.42)/.14));
      e.style.opacity=a.toFixed(3);e.style.filter=a<.98?`blur(${((1-a)*9).toFixed(1)}px)`:'none';e.style.transform=`translate3d(0,${((1-a)*(p>n+.2?-12:12)).toFixed(1)}px,0)`});
    const idx=clamp(Math.round(p),0,3);els.nav.forEach((b,n)=>b.classList.toggle('on',p>-.1&&n===idx));
    els.hint.style.opacity=(1-sm((p-PMIN)/.14)).toFixed(3);
  }
  return{build,resize,frame,built:false,setP:v=>drv.jump(v)};
})();

/* ================= shell ================= */
const DEMOS={d1:D1,d2:D2};let cur=null;
function show(id){
  cur=DEMOS[id];
  $$('.demo').forEach(s=>s.classList.toggle('on',s.id===id));
  $$('#dock button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===id));
  if(!cur.built){cur.build();cur.built=true}
  cur.resize();
}
$$('#dock button').forEach(b=>b.addEventListener('click',()=>show(b.dataset.t)));
let rz=0;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>cur&&cur.resize(),140)});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>cur&&cur.resize());
let last=performance.now();
function tick(now){
  const ms=now-last,dt=Math.min(.05,ms/1000);last=now;
  ptr.x+=(ptr.tx-ptr.x)*.06;ptr.y+=(ptr.ty-ptr.y)*.06;
  if(cur&&!document.hidden)cur.frame(dt,now/1000,ms);
  requestAnimationFrame(tick);
}
show('d1');requestAnimationFrame(tick);
window.__demo={show,d1p:v=>D1.setP(v),d2p:v=>D2.setP(v)};
})();
</script>
