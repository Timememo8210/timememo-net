<title>Project SUMMIT — Checkpoint</title>
<style>
  :root{--void:#050D16;--ice:#EAF6F3;--dim:#93A8B8;--teal:#2BD4BE;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Consolas",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100svh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(70% 55% at 20% 0%,rgba(43,212,190,.08),transparent 60%),
               radial-gradient(58% 42% at 80% 8%,rgba(124,92,255,.06),transparent 62%),var(--void);
    color:var(--ice);font-family:var(--sans)}
  .gate{width:min(400px,90vw);text-align:center;padding:20px}
  .peak{font-family:var(--mono);font-size:11px;letter-spacing:.3em;color:var(--teal);text-transform:uppercase}
  h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:12px 0 6px}
  p{color:var(--dim);font-size:13.5px;margin-bottom:26px}
  .mt{margin:0 auto 26px;width:180px;height:56px;opacity:.7}
  .mt path{fill:none;stroke:var(--teal);stroke-width:1.4;stroke-linecap:round}
  input{width:100%;padding:14px 16px;border-radius:12px;border:1px solid rgba(234,246,243,.18);
    background:rgba(234,246,243,.04);color:var(--ice);font-family:var(--mono);font-size:18px;
    letter-spacing:.4em;text-align:center;outline:none;transition:border-color .2s}
  input:focus{border-color:rgba(43,212,190,.6)}
  button{margin-top:14px;width:100%;padding:13px;border-radius:99px;border:none;cursor:pointer;
    font-family:var(--mono);font-size:13px;letter-spacing:.14em;color:#06231F;background:var(--teal);
    box-shadow:0 0 24px rgba(43,212,190,.3);transition:transform .2s}
  button:hover{transform:translateY(-1px)}
  .err{margin-top:14px;font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;color:#F08585;
    min-height:16px;visibility:hidden}
  .shake{animation:sh .4s}
  @keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  @media (prefers-reduced-motion:reduce){.shake{animation:none}}
</style>
</head>

function b(s){var x=atob(s),a=new Uint8Array(x.length);for(var i=0;i<x.length;i++)a[i]=x.charCodeAt(i);return a;}
async function unlock(pw){
  var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(DATA.s),iterations:600000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(DATA.i)},key,b(DATA.c));
  return new TextDecoder().decode(pt);
}
async function attempt(pw,silent){
  try{
    var html=await unlock(pw);
    try{sessionStorage.setItem("summit_code",pw);}catch(e){}
    document.open();document.write(html);document.close();
  }catch(e){
    if(silent)return;
    var g=document.getElementById("g"),er=document.getElementById("err");
    er.style.visibility="visible";g.classList.remove("shake");void g.offsetWidth;g.classList.add("shake");
  }
}
document.getElementById("go").addEventListener("click",function(){attempt(document.getElementById("pw").value)});
document.getElementById("pw").addEventListener("keydown",function(e){if(e.key==="Enter")attempt(e.target.value)});
try{var saved=sessionStorage.getItem("summit_code");if(saved)attempt(saved,true);}catch(e){}
