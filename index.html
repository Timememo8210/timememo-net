<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="no-referrer">
<title>Private Site</title>
<style>
:root{
  --bg:#0a0a0f;
  --panel:#12121a;
  --panel2:#1a1a26;
  --text:#e2e8f0;
  --muted:#94a3b8;
  --line:#252538;
  --accent:#6366f1;
  --accent2:#818cf8;
  --danger:#fb7185;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 20% 10%,rgba(99,102,241,.16),transparent 34%),
    radial-gradient(circle at 80% 82%,rgba(14,165,233,.10),transparent 32%),
    var(--bg);
  display:grid;
  place-items:center;
  padding:24px;
}
.gate{
  width:min(420px,100%);
  background:rgba(18,18,26,.92);
  border:1px solid var(--line);
  border-radius:16px;
  padding:28px;
  box-shadow:0 24px 80px rgba(0,0,0,.32);
}
.mark{
  width:42px;
  height:42px;
  border-radius:12px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,var(--accent),#a855f7);
  font-weight:800;
  margin-bottom:18px;
}
h1{font-size:1.35rem;margin:0 0 8px}
p{margin:0 0 22px;color:var(--muted);line-height:1.55;font-size:.95rem}
label{display:block;margin-bottom:8px;color:var(--muted);font-size:.82rem;font-weight:600}
.row{display:flex;gap:10px}
input{
  min-width:0;
  flex:1;
  height:44px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--panel2);
  color:var(--text);
  padding:0 12px;
  font:inherit;
}
input:focus{outline:2px solid rgba(99,102,241,.35);border-color:var(--accent)}
button{
  height:44px;
  border:0;
  border-radius:10px;
  background:linear-gradient(135deg,var(--accent),#a855f7);
  color:#fff;
  font:inherit;
  font-weight:700;
  padding:0 18px;
  cursor:pointer;
}
.error{min-height:20px;margin-top:12px;color:var(--danger);font-size:.84rem}
.hint{margin-top:20px;color:#64748b;font-size:.78rem}
@media(max-width:520px){
  .gate{padding:22px}
  .row{flex-direction:column}
  button{width:100%}
}
</style>
</head>
<body>
<main class="gate" aria-labelledby="title">
  <div class="mark">T</div>
  <h1 id="title">Private site</h1>
  <p>This page is not indexed. Enter the password to continue.</p>
  <form id="gateForm" autocomplete="off">
    <label for="password">Password</label>
    <div class="row">
      <input id="password" name="password" type="password" autocomplete="current-password" autofocus>
      <button type="submit">Enter</button>
    </div>
    <div class="error" id="error" role="alert"></div>
  </form>
  <div class="hint">Shared research links may be opened directly if you have the URL.</div>
</main>
<script>
const HOME_PATH = '/home/883d65ant1/';
const PASSWORD_HASH = '2c1e8649b4978db30bbd7ba018674d65b8e195e524d541f170539103fc78e963';

async function sha256Hex(value) {
  const data = new TextEncoder().encode(value);
  const hash = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
}

if (sessionStorage.getItem('tmHomeAuth') === '1') {
  location.replace(HOME_PATH);
}

document.getElementById('gateForm').addEventListener('submit', async event => {
  event.preventDefault();
  const input = document.getElementById('password');
  const error = document.getElementById('error');
  error.textContent = '';
  const hash = await sha256Hex(input.value);
  if (hash === PASSWORD_HASH) {
    sessionStorage.setItem('tmHomeAuth', '1');
    location.assign(HOME_PATH);
  } else {
    input.value = '';
    error.textContent = 'Incorrect password.';
    input.focus();
  }
});
</script>
</body>
</html>
